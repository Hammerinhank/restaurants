<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Restaurants</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{
    --bg:#f6f4ef;
    --panel:#ffffff;
    --ink:#1f2320;
    --muted:#6b6f6a;
    --accent:#c1502e;
    --accent-ink:#ffffff;
    --line:#e3e0d6;
    --ok:#2f7a4f;
    --err:#b3341c;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);
    color:var(--ink);
    display:flex;
    flex-direction:column;
    overscroll-behavior:none;
  }

  header{
    background:var(--panel);
    border-bottom:1px solid var(--line);
    padding:10px 12px;
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    position:relative;
    z-index:1000;
  }
  header h1{
    font-size:17px;
    margin:0;
    font-weight:700;
    letter-spacing:.2px;
    flex:0 0 auto;
  }
  .badge{
    font-size:10px;
    color:var(--muted);
    border:1px solid var(--line);
    border-radius:20px;
    padding:1px 7px;
    cursor:pointer;
    user-select:none;
  }
  .spacer{flex:1 1 auto;}

  button{
    font:inherit;
    border:none;
    border-radius:9px;
    padding:9px 14px;
    cursor:pointer;
    font-weight:600;
    font-size:14px;
  }
  .btn-primary{
    background:var(--accent);
    color:var(--accent-ink);
  }
  .btn-primary:disabled{opacity:.55;cursor:default;}
  .btn-ghost{
    background:transparent;
    color:var(--ink);
    border:1px solid var(--line);
  }
  .btn-danger{
    background:transparent;
    color:var(--err);
    border:1px solid var(--err);
    padding:5px 9px;
    font-size:12px;
  }
  .btn-small{
    padding:5px 9px;
    font-size:12px;
  }

  #statusLine{
    font-size:12px;
    color:var(--muted);
    padding:0 12px 8px;
    min-height:14px;
  }
  #statusLine.err{color:var(--err);}
  #statusLine.ok{color:var(--ok);}

  #settings{
    background:var(--panel);
    border-bottom:1px solid var(--line);
    padding:12px;
    display:none;
    gap:8px;
    flex-direction:column;
    font-size:13px;
  }
  #settings.open{display:flex;}
  #settings label{
    display:flex;
    flex-direction:column;
    gap:3px;
    color:var(--muted);
    font-size:12px;
  }
  #settings input{
    font:inherit;
    padding:8px 9px;
    border:1px solid var(--line);
    border-radius:7px;
    background:#fff;
  }
  .settings-row{display:flex;gap:8px;flex-wrap:wrap;}
  .settings-row > label{flex:1 1 140px;}
  .settings-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px;}

  #main{
    flex:1 1 auto;
    display:flex;
    min-height:0;
  }
  #map{
    flex:1 1 auto;
    min-width:0;
  }

  #listPanel{
    width:290px;
    flex:0 0 auto;
    background:var(--panel);
    border-left:1px solid var(--line);
    overflow-y:auto;
    display:flex;
    flex-direction:column;
  }
  #listPanel h2{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.6px;
    color:var(--muted);
    margin:0;
    padding:12px 12px 6px;
  }
  .empty-hint{
    padding:10px 12px;
    font-size:13px;
    color:var(--muted);
  }
  .resto-item{
    padding:10px 12px;
    border-top:1px solid var(--line);
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    gap:8px;
    align-items:flex-start;
  }
  .resto-item:hover{background:#faf8f3;}
  .resto-item.selected{
    background:#faf0ea;
    border-left:3px solid var(--accent);
    padding-left:9px;
  }
  .resto-item .txt{min-width:0;}
  .resto-item .nom{
    font-weight:600;
    font-size:13.5px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .resto-item .adr{
    font-size:12px;
    color:var(--muted);
    margin-top:2px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  @media (max-width:720px){
    #main{flex-direction:column;}
    #listPanel{
      width:auto;
      max-height:34vh;
      border-left:none;
      border-top:1px solid var(--line);
    }
  }

  /* Marker */
  .resto-pin{
    background:var(--accent);
    width:30px;height:30px;border-radius:50% 50% 50% 0;
    transform:rotate(-45deg);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 1px 4px rgba(0,0,0,.35);
    border:2px solid #fff;
  }
  .resto-pin span{
    transform:rotate(45deg);
    font-size:14px;
  }
  .resto-pin.selected{
    box-shadow:0 0 0 4px rgba(193,80,46,.4), 0 1px 4px rgba(0,0,0,.35);
    cursor:grab;
  }

  /* Popup */
  .leaflet-popup-content{margin:10px 12px;min-width:190px;}
  .popup-field{margin-bottom:6px;}
  .popup-label{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);}
  .popup-text{
    font-size:14px;
    cursor:text;
    border-bottom:1px dashed transparent;
    padding:1px 0;
    touch-action:manipulation; /* évite que le double-tap iOS soit intercepté comme un zoom de page */
  }
  .popup-text:hover{border-bottom-color:var(--line);}
  .popup-text.nom{font-weight:700;font-size:15px;}
  .popup-edit{
    width:100%;
    font:inherit;
    font-size:16px; /* >=16px : empêche Safari iOS de zoomer automatiquement la page au focus du champ */
    padding:4px 6px;
    border:1px solid var(--accent);
    border-radius:6px;
  }
  .popup-actions{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:8px;
    padding-top:6px;
    border-top:1px solid var(--line);
  }
  .popup-date{font-size:10px;color:var(--muted);}

  /* Modale de confirmation */
  .modal-overlay{
    position:fixed;inset:0;
    background:rgba(20,18,14,.45);
    display:flex;align-items:center;justify-content:center;
    z-index:3000;
    padding:16px;
    opacity:0;
    pointer-events:none;
    transition:opacity .15s ease;
  }
  .modal-overlay.open{opacity:1;pointer-events:auto;}
  .modal-box{
    background:var(--panel);
    border-radius:12px;
    padding:18px;
    width:100%;
    max-width:340px;
    box-shadow:0 10px 40px rgba(0,0,0,.35);
  }
  .modal-box h3{margin:0 0 4px;font-size:15px;}
  .modal-hint{font-size:11.5px;color:var(--muted);margin:0 0 12px;}
  .modal-box label{
    display:flex;flex-direction:column;gap:4px;
    font-size:12px;color:var(--muted);
    margin-bottom:10px;
  }
  .modal-box input, .modal-box select{
    font:inherit;padding:8px 9px;border:1px solid var(--line);border-radius:7px;background:#fff;
  }
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:4px;}
  .modal-actions-centre{justify-content:center;margin-top:14px;}

  .modal-box-attente{max-width:260px;text-align:center;}
  #attenteTexte{font-size:14px;color:var(--ink);}
  #attenteChrono{font-size:12px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums;}
  .spinner{
    width:32px;height:32px;
    border:3px solid var(--line);
    border-top-color:var(--accent);
    border-radius:50%;
    margin:0 auto 12px;
    animation:tourner .8s linear infinite;
  }
  @keyframes tourner{ to{ transform:rotate(360deg); } }
</style>

<!-- ===== Bloc TEST/DIAGNOSTIC (ajouté, n'affecte pas le reste de l'application) ===== -->
<style>
  .modal-box-diag{max-width:640px;width:96vw;}
  .diag-report{
    background:#faf8f3;
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px 12px;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:11.5px;
    line-height:1.5;
    white-space:pre-wrap;
    word-break:break-word;
    max-height:55vh;
    overflow-y:auto;
    margin:8px 0 4px;
  }
</style>
</head>
<body>

<header>
  <h1>🍽️ Restaurants</h1>
  <span class="badge" id="versionBadge" title="Historique des versions">V1</span>
  <div class="spacer"></div>
  <button class="btn-ghost" id="btnSettings">⚙️ GitHub</button>
  <button class="btn-ghost" id="btnDiagTest" title="Diagnostic réseau détaillé (Overpass, géolocalisation, etc.)">🔧 Test</button>
  <button class="btn-primary" id="btnNouveau">📍 Nouveau restaurant</button>
</header>

<div id="statusLine"></div>

<div id="settings">
  <div class="settings-row">
    <label>Utilisateur / organisation GitHub
      <input type="text" id="cfgOwner" autocomplete="off" placeholder="ex. hammerinhank">
    </label>
    <label>Dépôt
      <input type="text" id="cfgRepo" autocomplete="off" placeholder="ex. restaurant">
    </label>
    <label>Branche
      <input type="text" id="cfgBranch" autocomplete="off" placeholder="main" value="main">
    </label>
  </div>
  <div class="settings-row">
    <label>Jeton d'accès personnel (PAT)
      <input type="password" id="cfgToken" autocomplete="off" placeholder="ghp_...">
    </label>
  </div>
  <div class="settings-actions">
    <button class="btn-primary btn-small" id="btnSaveCfg">Enregistrer les identifiants</button>
    <button class="btn-ghost btn-small" id="btnClearCfg">Effacer les identifiants</button>
    <button class="btn-ghost btn-small" id="btnPush">⬆️ Envoyer vers GitHub</button>
    <button class="btn-ghost btn-small" id="btnPull">⬇️ Récupérer depuis GitHub</button>
  </div>
</div>

<div id="main">
  <div id="map"></div>
  <div id="listPanel">
    <h2>Liste (<span id="countLbl">0</span>)</h2>
    <div id="listBody"></div>
  </div>
</div>

<div class="modal-overlay" id="attenteOverlay">
  <div class="modal-box modal-box-attente">
    <div class="spinner" aria-hidden="true"></div>
    <div id="attenteTexte">Recherche en cours…</div>
    <div id="attenteChrono">0 s</div>
    <div class="modal-actions modal-actions-centre">
      <button class="btn-ghost btn-small" id="attenteAnnuler">Annuler</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <h3>Confirmer le restaurant</h3>
    <div class="modal-hint" id="modalHint"></div>
    <label>Nom
      <input type="text" id="modalNom" autocomplete="off">
    </label>
    <label id="modalAlternativesChamp">Autres restaurants à proximité
      <select id="modalAlternatives"></select>
    </label>
    <label>Adresse
      <input type="text" id="modalAdresse" autocomplete="off">
    </label>
    <div class="modal-actions">
      <button class="btn-ghost btn-small" id="modalAnnuler">Ignorer</button>
      <button class="btn-primary btn-small" id="modalValider">Valider</button>
    </div>
  </div>
</div>

<!-- ===== Bloc TEST/DIAGNOSTIC : modale de rapport (ajoutée) ===== -->
<div class="modal-overlay" id="diagOverlay">
  <div class="modal-box modal-box-diag">
    <h3>🔧 Diagnostic réseau</h3>
    <div class="modal-hint" id="diagStatus">Prêt.</div>
    <pre id="diagReportText" class="diag-report">Cliquez sur « Relancer » pour lancer le diagnostic.</pre>
    <div class="modal-actions">
      <button class="btn-ghost btn-small" id="diagCopier">📋 Copier</button>
      <button class="btn-ghost btn-small" id="diagTelecharger">💾 Télécharger (.txt)</button>
      <button class="btn-ghost btn-small" id="diagRelancer">🔄 Relancer</button>
      <button class="btn-primary btn-small" id="diagFermer">Fermer</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
  "use strict";

  const VERSION = "V9";
  document.getElementById("versionBadge").textContent = VERSION;

  const LS_DATA_KEY = "restaurants.v1";
  const LS_CFG_KEY = "restaurantsGithubConfig.v1";
  const FILE_NAME = "restaurants.json";

  // ---------- État ----------
  let restaurants = chargerLocal();   // [{id, lat, lon, name, address, maj}]
  let cfg = chargerCfg();             // {owner, repo, branch, token}
  let markers = {};                   // id -> L.marker
  let dernierSha = null;              // sha du fichier GitHub connu
  let selectedId = null;              // id du restaurant sélectionné (déplaçable)
  let deplacementTimer = null;        // délai avant de lancer la recherche après un déplacement
  let attenteControleur = null;       // AbortController de la recherche en cours (annulable)
  let attenteIntervalId = null;       // intervalle du chronomètre affiché dans la fenêtre d'attente

  // ---------- Persistance locale ----------
  function chargerLocal(){
    try{
      const raw = localStorage.getItem(LS_DATA_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  }
  function sauverLocal(){
    localStorage.setItem(LS_DATA_KEY, JSON.stringify(restaurants));
  }
  function chargerCfg(){
    try{
      const raw = localStorage.getItem(LS_CFG_KEY);
      return raw ? JSON.parse(raw) : {owner:"",repo:"",branch:"main",token:""};
    }catch(e){ return {owner:"",repo:"",branch:"main",token:""}; }
  }
  function sauverCfg(){
    localStorage.setItem(LS_CFG_KEY, JSON.stringify(cfg));
  }

  // ---------- Statut ----------
  let statusTimer = null;
  function statut(msg, type){
    const el = document.getElementById("statusLine");
    el.textContent = msg || "";
    el.className = type || "";
    if(statusTimer) clearTimeout(statusTimer);
    if(msg){
      statusTimer = setTimeout(()=>{ el.textContent=""; el.className=""; }, 6000);
    }
  }

  // ---------- Carte ----------
  const map = L.map("map", {zoomControl:true}).setView([46.6, 2.4], 6);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: "&copy; contributeurs OpenStreetMap"
  }).addTo(map);

  function iconResto(selectionne){
    const cls = selectionne ? "resto-pin selected" : "resto-pin";
    return L.divIcon({
      className: "",
      html: `<div class="${cls}"><span>🍽️</span></div>`,
      iconSize: [30,30],
      iconAnchor: [15,29],
      popupAnchor: [0,-28]
    });
  }

  function idUnique(){
    return "r_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,8);
  }

  // ---------- Rendu ----------
  function popupHTML(r){
    const dateAff = new Date(r.maj).toLocaleString("fr-FR");
    return `
      <div class="popup-field">
        <div class="popup-label">Nom</div>
        <div class="popup-text nom" data-id="${r.id}" data-field="name">${escHtml(r.name || "Nouveau restaurant")}</div>
      </div>
      <div class="popup-field">
        <div class="popup-label">Adresse</div>
        <div class="popup-text adr" data-id="${r.id}" data-field="address">${escHtml(r.address || "(adresse non définie, double-cliquez pour saisir)")}</div>
      </div>
      <div class="popup-actions">
        <span class="popup-date">${dateAff}</span>
        <button class="btn-danger" data-del="${r.id}">Supprimer</button>
      </div>
    `;
  }

  function escHtml(s){
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  function redessinerMarqueur(r){
    let m = markers[r.id];
    if(!m){
      m = L.marker([r.lat, r.lon], {icon: iconResto(r.id===selectedId), draggable:false}).addTo(map);
      markers[r.id] = m;
      m.on("popupopen", ()=> brancherEditionPopup(r.id));
      m.on("click", ()=> definirSelection(r.id, {pan:false}));
      m.on("dragend", ()=> gererDeplacement(r.id));
      if(r.id === selectedId && m.dragging) m.dragging.enable();
    }else{
      m.setLatLng([r.lat, r.lon]);
      m.setIcon(iconResto(r.id===selectedId));
    }
    m.bindPopup(popupHTML(r));
  }

  // Sélectionne un restaurant : active le glisser-déposer de son icône,
  // désactive celui des autres, met en surbrillance dans la liste et sur la carte.
  function definirSelection(id, {pan=false} = {}){
    const precedent = selectedId;
    selectedId = id;
    if(precedent && precedent !== id && markers[precedent]){
      markers[precedent].setIcon(iconResto(false));
      if(markers[precedent].dragging) markers[precedent].dragging.disable();
    }
    if(id && markers[id]){
      markers[id].setIcon(iconResto(true));
      if(markers[id].dragging) markers[id].dragging.enable();
      if(pan){
        const r = restaurants.find(x=>x.id===id);
        if(r) map.setView([r.lat, r.lon], Math.max(map.getZoom(), 16), {animate:true});
      }
      markers[id].openPopup();
      statut("Restaurant sélectionné : faites glisser son icône sur la carte pour la déplacer.", "ok");
    }
    rafraichirListe();
  }

  // Appelé à chaque relâchement de l'icône : met à jour les coordonnées immédiatement,
  // puis planifie l'identification du restaurant après 2 s d'inactivité (le déplacement
  // peut se faire en plusieurs fois : chaque nouveau relâchement réinitialise le délai
  // et annule une recherche déjà en cours).
  function gererDeplacement(id){
    const r = restaurants.find(x=>x.id===id);
    const m = markers[id];
    if(!r || !m) return;
    const ll = m.getLatLng();
    r.lat = ll.lat;
    r.lon = ll.lng;
    r.maj = new Date().toISOString();
    sauverLocal();
    rafraichirListe();
    pousserVersGithubDifféré();

    if(deplacementTimer) clearTimeout(deplacementTimer);
    if(attenteControleur){ attenteControleur.abort(); fermerAttente(); }
    deplacementTimer = setTimeout(()=>{
      deplacementTimer = null;
      const rActuel = restaurants.find(x=>x.id===id);
      if(rActuel) identifierEtConfirmer(rActuel);
    }, 2000);
  }

  function supprimerMarqueur(id){
    const m = markers[id];
    if(m){ map.removeLayer(m); delete markers[id]; }
  }

  function brancherEditionPopup(id){
    const popupEl = document.querySelector(`.popup-text[data-id="${id}"]`)?.closest(".leaflet-popup-content");
    if(!popupEl) return;
    popupEl.querySelectorAll(".popup-text").forEach(el=>{
      el.ondblclick = () => passerEnEdition(el);
    });
    const delBtn = popupEl.querySelector("[data-del]");
    if(delBtn){
      delBtn.onclick = () => supprimerRestaurant(delBtn.getAttribute("data-del"));
    }
  }

  function passerEnEdition(el){
    const id = el.getAttribute("data-id");
    const field = el.getAttribute("data-field");
    const r = restaurants.find(x=>x.id===id);
    if(!r) return;
    const depuisPopup = !!el.closest(".leaflet-popup-content");
    const valeurActuelle = r[field] || "";
    const input = document.createElement("input");
    input.type = "text";
    input.className = "popup-edit";
    input.value = valeurActuelle;
    el.replaceWith(input);
    input.focus();
    input.select();

    const valider = () => {
      const nv = input.value.trim();
      r[field] = nv;
      r.maj = new Date().toISOString();
      sauverLocal();
      const newEl = document.createElement("div");
      newEl.className = el.className;
      newEl.setAttribute("data-id", id);
      newEl.setAttribute("data-field", field);
      newEl.textContent = nv || (field === "name" ? "Nouveau restaurant" : "(adresse non définie, double-cliquez pour saisir)");
      newEl.ondblclick = () => passerEnEdition(newEl);
      input.replaceWith(newEl);
      redessinerMarqueur(r);
      if(depuisPopup){
        const m = markers[id];
        if(m) m.openPopup();
        brancherEditionPopup(id);
      }
      rafraichirListe();
      pousserVersGithubDifféré();
    };
    input.addEventListener("blur", valider);
    input.addEventListener("keydown", (ev)=>{
      if(ev.key === "Enter"){ input.blur(); }
      if(ev.key === "Escape"){ input.value = valeurActuelle; input.blur(); }
    });
  }

  function supprimerRestaurant(id){
    if(!confirm("Supprimer ce restaurant de la liste ?")) return;
    restaurants = restaurants.filter(r=>r.id!==id);
    sauverLocal();
    supprimerMarqueur(id);
    rafraichirListe();
    pousserVersGithubDifféré();
  }

  // ---------- Liste latérale ----------
  function rafraichirListe(){
    const body = document.getElementById("listBody");
    document.getElementById("countLbl").textContent = restaurants.length;
    if(restaurants.length === 0){
      body.innerHTML = '<div class="empty-hint">Aucun restaurant enregistré. Utilisez le bouton « Nouveau restaurant ».</div>';
      return;
    }
    const tries = [...restaurants].sort((a,b)=> (b.maj||"").localeCompare(a.maj||""));
    body.innerHTML = tries.map(r => `
      <div class="resto-item${r.id===selectedId ? ' selected' : ''}" data-goto="${r.id}">
        <div class="txt">
          <div class="popup-text nom" data-id="${r.id}" data-field="name">${escHtml(r.name || "Nouveau restaurant")}</div>
          <div class="popup-text adr" data-id="${r.id}" data-field="address">${escHtml(r.address || "adresse non définie")}</div>
        </div>
        <button class="btn-danger" data-del="${r.id}">✕</button>
      </div>
    `).join("");
    body.querySelectorAll("[data-goto]").forEach(el=>{
      el.addEventListener("click",(ev)=>{
        if(ev.target.closest("[data-del]") || ev.target.closest(".popup-text")) return;
        definirSelection(el.getAttribute("data-goto"), {pan:true});
      });
    });
    body.querySelectorAll("[data-del]").forEach(el=>{
      el.addEventListener("click",(ev)=>{
        ev.stopPropagation();
        supprimerRestaurant(el.getAttribute("data-del"));
      });
    });
    body.querySelectorAll(".popup-text").forEach(el=>{
      el.ondblclick = (ev)=>{
        ev.stopPropagation();
        passerEnEdition(el);
      };
    });
  }

  function toutRedessiner(){
    Object.keys(markers).forEach(supprimerMarqueur);
    restaurants.forEach(redessinerMarqueur);
    rafraichirListe();
  }

  // ---------- Reverse geocoding (Nominatim) ----------
  async function reverseGeocode(lat, lon, signal){
    const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1&namedetails=1&accept-language=fr`;
    const res = await fetchAvecDelai(url, { headers: { "Accept": "application/json" } }, 8000, signal);
    if(!res.ok) throw new Error("Nominatim HTTP " + res.status);
    const data = await res.json();

    let nom = "";
    if(data.namedetails && data.namedetails.name){
      nom = data.namedetails.name;
    }else if(data.name){
      nom = data.name;
    }else if(data.address && (data.address.restaurant || data.address.amenity)){
      nom = data.address.restaurant || data.address.amenity;
    }

    let adresse = "";
    if(data.address){
      const a = data.address;
      const numRue = [a.house_number, a.road].filter(Boolean).join(" ");
      const ville = a.postcode || a.city || a.town || a.village
        ? [a.postcode, a.city || a.town || a.village].filter(Boolean).join(" ")
        : "";
      adresse = [numRue, ville].filter(Boolean).join(", ");
    }
    if(!adresse && data.display_name){
      adresse = data.display_name;
    }

    return {nom, adresse};
  }

  // ---------- Recherche du restaurant le plus proche (Overpass / OSM) ----------
  function distanceMetres(lat1, lon1, lat2, lon2){
    const R = 6371000;
    const toRad = d => d * Math.PI / 180;
    const dLat = toRad(lat2 - lat1);
    const dLon = toRad(lon2 - lon1);
    const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  // fetch avec un délai maximal propre (au lieu de dépendre du délai par défaut,
  // parfois très long, du système/navigateur), tout en restant annulable via signalExterne.
  async function fetchAvecDelai(url, options, delaiMs, signalExterne){
    const controllerLocal = new AbortController();
    const timeoutId = setTimeout(()=> controllerLocal.abort(), delaiMs);
    const onExterneAbort = () => controllerLocal.abort();
    if(signalExterne){
      if(signalExterne.aborted) controllerLocal.abort();
      else signalExterne.addEventListener("abort", onExterneAbort, {once:true});
    }
    try{
      return await fetch(url, Object.assign({}, options, {signal: controllerLocal.signal}));
    }finally{
      clearTimeout(timeoutId);
      if(signalExterne) signalExterne.removeEventListener("abort", onExterneAbort);
    }
  }

  // Plusieurs miroirs publics de l'API Overpass : le serveur overpass-api.de est en fait
  // une fédération de machines, dont certaines ne renvoient pas toujours d'en-tête CORS
  // (Access-Control-Allow-Origin). On tente donc plusieurs miroirs en parallèle.
  // Note : overpass.private.coffee est le nom actuel du service précédemment connu sous
  // overpass.kumi.systems (renommage officiel d'après le wiki OpenStreetMap) — l'ancien
  // nom peut être beaucoup plus lent selon la route réseau empruntée.
  const OVERPASS_ENDPOINTS = [
    "https://overpass-api.de/api/interpreter",
    "https://overpass.private.coffee/api/interpreter",
    "https://overpass.openstreetmap.ru/api/interpreter"
  ];

  function extraireRestaurants(data, lat, lon, limite){
    const candidats = (data.elements || []).map(el=>{
      const la = el.lat !== undefined ? el.lat : (el.center ? el.center.lat : null);
      const lo = el.lon !== undefined ? el.lon : (el.center ? el.center.lon : null);
      const nom = el.tags && el.tags.name;
      if(la == null || lo == null || !nom) return null;
      const t = el.tags;
      const numRue = [t["addr:housenumber"], t["addr:street"]].filter(Boolean).join(" ");
      const ville = [t["addr:postcode"], t["addr:city"]].filter(Boolean).join(" ");
      return {
        nom,
        adresse: [numRue, ville].filter(Boolean).join(", "),
        distance: Math.round(distanceMetres(lat, lon, la, lo))
      };
    }).filter(Boolean).sort((a,b)=> a.distance - b.distance);
    return candidats.slice(0, limite);
  }

  async function interrogerMiroir(endpoint, requete, signal){
    const res = await fetchAvecDelai(endpoint, {
      method: "POST",
      body: "data=" + encodeURIComponent(requete)
    }, 8000, signal);
    if(!res.ok) throw new Error("HTTP " + res.status + " (" + endpoint + ")");
    return res.json();
  }

  async function rechercherRestaurantsProches(lat, lon, limite, signal){
    const rayon = 200; // mètres
    const requete = `[out:json][timeout:15];(node["amenity"="restaurant"]["name"](around:${rayon},${lat},${lon});way["amenity"="restaurant"]["name"](around:${rayon},${lat},${lon});relation["amenity"="restaurant"]["name"](around:${rayon},${lat},${lon}););out center tags;`;
    if(signal && signal.aborted) throw new DOMException("Recherche annulée", "AbortError");
    try{
      // Les miroirs sont interrogés EN PARALLÈLE (pas l'un après l'autre) : on garde le
      // premier qui répond correctement, avec un délai maximal de 8 s chacun — au lieu
      // d'attendre le délai par défaut (parfois ~20 s) de chaque miroir en séquence.
      const data = await Promise.any(
        OVERPASS_ENDPOINTS.map(endpoint => interrogerMiroir(endpoint, requete, signal))
      );
      return extraireRestaurants(data, lat, lon, limite);
    }catch(err){
      if(signal && signal.aborted) throw new DOMException("Recherche annulée", "AbortError");
      if(err && err.name === "AggregateError" && err.errors && err.errors.length){
        throw err.errors[0];
      }
      throw err;
    }
  }

  // ---------- Boîte de dialogue de confirmation ----------
  function ouvrirModalIdentification({nom, adresse, indice, alternatives}){
    return new Promise((resolve)=>{
      const overlay = document.getElementById("modalOverlay");
      const inputNom = document.getElementById("modalNom");
      const inputAdr = document.getElementById("modalAdresse");
      const hint = document.getElementById("modalHint");
      const champAlt = document.getElementById("modalAlternativesChamp");
      const selectAlt = document.getElementById("modalAlternatives");
      const btnValider = document.getElementById("modalValider");
      const btnAnnuler = document.getElementById("modalAnnuler");

      const listeAlt = alternatives || [];
      inputNom.value = nom || "";
      inputAdr.value = adresse || "";
      hint.textContent = indice || "";
      selectAlt.innerHTML = '<option value="">— choisir une autre suggestion —</option>' +
        listeAlt.map((a,i)=> `<option value="${i}">${escHtml(a.nom)} (${a.distance} m)</option>`).join("");
      champAlt.style.display = listeAlt.length ? "flex" : "none";
      selectAlt.value = "";

      overlay.classList.add("open");
      setTimeout(()=> inputNom.focus(), 60);

      const onChangeAlt = () => {
        const idx = selectAlt.value;
        // Choisir une suggestion alternative ne remplace que le nom, jamais l'adresse.
        if(idx !== "" && listeAlt[idx]) inputNom.value = listeAlt[idx].nom;
      };
      const nettoyer = () => {
        overlay.classList.remove("open");
        btnValider.removeEventListener("click", onValider);
        btnAnnuler.removeEventListener("click", onAnnuler);
        overlay.removeEventListener("keydown", onKey);
        selectAlt.removeEventListener("change", onChangeAlt);
      };
      const onValider = () => {
        const nv = inputNom.value.trim();
        const av = inputAdr.value.trim();
        nettoyer();
        resolve({ok:true, nom:nv, adresse:av});
      };
      const onAnnuler = () => { nettoyer(); resolve({ok:false}); };
      const onKey = (ev) => {
        if(ev.key === "Enter" && ev.target !== selectAlt) onValider();
        if(ev.key === "Escape") onAnnuler();
      };
      selectAlt.addEventListener("change", onChangeAlt);
      btnValider.addEventListener("click", onValider);
      btnAnnuler.addEventListener("click", onAnnuler);
      overlay.addEventListener("keydown", onKey);
    });
  }

  // ---------- Fenêtre d'attente annulable ----------
  function ouvrirAttente(message){
    const overlay = document.getElementById("attenteOverlay");
    const texte = document.getElementById("attenteTexte");
    const chrono = document.getElementById("attenteChrono");
    const btnAnnuler = document.getElementById("attenteAnnuler");
    texte.textContent = message || "Recherche en cours…";
    chrono.textContent = "0 s";
    overlay.classList.add("open");
    const controller = new AbortController();
    attenteControleur = controller;
    btnAnnuler.onclick = () => controller.abort();

    const debut = Date.now();
    attenteIntervalId = setInterval(()=>{
      chrono.textContent = Math.round((Date.now() - debut) / 1000) + " s";
    }, 1000);

    return controller;
  }

  function fermerAttente(){
    document.getElementById("attenteOverlay").classList.remove("open");
    document.getElementById("attenteAnnuler").onclick = null;
    attenteControleur = null;
    if(attenteIntervalId){ clearInterval(attenteIntervalId); attenteIntervalId = null; }
  }

  // Cherche les restaurants les plus proches (nommés, via Overpass) + l'adresse (via Nominatim),
  // puis demande confirmation dans une boîte de dialogue. Annulable via la fenêtre d'attente.
  async function identifierEtConfirmer(r, options){
    const precision = options && options.precision;
    const controller = ouvrirAttente("Recherche du restaurant à proximité…");

    const [resProches, resAdresse] = await Promise.allSettled([
      rechercherRestaurantsProches(r.lat, r.lon, 5, controller.signal),
      reverseGeocode(r.lat, r.lon, controller.signal)
    ]);

    const annule = controller.signal.aborted;
    fermerAttente();
    if(annule){
      statut("Recherche annulée. Vous pouvez saisir le nom et l'adresse manuellement (double-clic).", "");
      return;
    }

    let principal = null;
    let alternatives = [];
    let indice;

    if(resProches.status === "fulfilled"){
      const proches = resProches.value || [];
      principal = proches[0] || null;
      alternatives = proches.slice(1, 5);
      indice = principal
        ? `Restaurant le plus proche : ${principal.nom} (${principal.distance} m).`
        : "Aucun restaurant nommé trouvé dans OpenStreetMap à moins de 200 m de ce point.";
    }else{
      const msg = (resProches.reason && resProches.reason.message) ? resProches.reason.message : "erreur inconnue";
      indice = `La recherche de restaurants à proximité a échoué sur tous les serveurs Overpass essayés : ${msg}.`;
      console.error("Overpass:", resProches.reason);
    }
    if(precision != null){
      indice += ` Position localisée à ${Math.round(precision)} m près.`;
    }

    const adresseNominatim = (resAdresse.status === "fulfilled" && resAdresse.value) ? resAdresse.value.adresse : "";
    const adresseTrouvee = adresseNominatim || (principal ? principal.adresse : "") || r.address;

    const choix = await ouvrirModalIdentification({
      nom: principal ? principal.nom : r.name,
      adresse: adresseTrouvee,
      indice,
      alternatives
    });

    if(choix.ok){
      r.name = choix.nom || "Nouveau restaurant";
      r.address = choix.adresse || "";
      r.maj = new Date().toISOString();
      sauverLocal();
      redessinerMarqueur(r);
      if(markers[r.id] && markers[r.id].isPopupOpen()){
        markers[r.id].openPopup();
        brancherEditionPopup(r.id);
      }
      rafraichirListe();
      pousserVersGithubDifféré();
      statut("Informations confirmées.", "ok");
    }else{
      statut("Suggestion ignorée. Vous pouvez saisir les informations manuellement (double-clic).", "");
    }
  }


  document.getElementById("btnNouveau").addEventListener("click", async ()=>{
    if(!navigator.geolocation){
      statut("La géolocalisation n'est pas disponible sur cet appareil.", "err");
      return;
    }
    const btn = document.getElementById("btnNouveau");
    btn.disabled = true;
    statut("Localisation en cours…");

    navigator.geolocation.getCurrentPosition(async (pos)=>{
      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;
      const precision = pos.coords.accuracy;
      const r = {
        id: idUnique(),
        lat, lon,
        name: "Nouveau restaurant",
        address: "",
        maj: new Date().toISOString()
      };
      restaurants.push(r);
      sauverLocal();
      redessinerMarqueur(r);
      definirSelection(r.id, {pan:true});
      btn.disabled = false;
      pousserVersGithubDifféré();

      await identifierEtConfirmer(r, {precision});

    }, (err)=>{
      btn.disabled = false;
      statut("Localisation refusée ou indisponible : " + err.message, "err");
    }, {enableHighAccuracy:true, timeout:12000, maximumAge:0});
  });

  // ---------- Réglages GitHub ----------
  const elOwner = document.getElementById("cfgOwner");
  const elRepo = document.getElementById("cfgRepo");
  const elBranch = document.getElementById("cfgBranch");
  const elToken = document.getElementById("cfgToken");

  function remplirChampsCfg(){
    elOwner.value = cfg.owner || "";
    elRepo.value = cfg.repo || "";
    elBranch.value = cfg.branch || "main";
    elToken.value = cfg.token || "";
  }
  remplirChampsCfg();

  document.getElementById("btnSettings").addEventListener("click", ()=>{
    document.getElementById("settings").classList.toggle("open");
  });

  document.getElementById("btnSaveCfg").addEventListener("click", ()=>{
    const owner = elOwner.value.trim();
    const repo = elRepo.value.trim();
    const branch = elBranch.value.trim() || "main";
    const token = elToken.value.trim();
    if(!owner || !repo || !token){
      statut("Utilisateur, dépôt et jeton sont requis.", "err");
      return;
    }
    cfg = {owner, repo, branch, token};
    sauverCfg();
    statut("Identifiants GitHub enregistrés.", "ok");
    chargerDepuisGithub(true);
  });

  document.getElementById("btnClearCfg").addEventListener("click", ()=>{
    if(!confirm("Effacer les identifiants GitHub enregistrés sur cet appareil ?")) return;
    cfg = {owner:"",repo:"",branch:"main",token:""};
    sauverCfg();
    remplirChampsCfg();
    dernierSha = null;
    statut("Identifiants effacés.", "ok");
  });

  document.getElementById("btnPush").addEventListener("click", ()=> pousserVersGithub(true));
  document.getElementById("btnPull").addEventListener("click", ()=> chargerDepuisGithub(true));

  function cfgComplete(){
    return !!(cfg.owner && cfg.repo && cfg.token);
  }

  // ---------- Synchro GitHub ----------
  function b64EncodeUnicode(str){
    return btoa(unescape(encodeURIComponent(str)));
  }
  function b64DecodeUnicode(str){
    return decodeURIComponent(escape(atob(str)));
  }

  async function chargerDepuisGithub(feedback){
    if(!cfgComplete()){
      if(feedback) statut("Identifiants GitHub incomplets.", "err");
      return;
    }
    if(feedback) statut("Récupération depuis GitHub…");
    try{
      const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${FILE_NAME}?ref=${encodeURIComponent(cfg.branch)}`;
      const res = await fetch(url, {
        headers: {
          "Authorization": `Bearer ${cfg.token}`,
          "Accept": "application/vnd.github+json"
        }
      });
      if(res.status === 404){
        dernierSha = null;
        if(feedback) statut("Aucun fichier distant pour l'instant (il sera créé au premier envoi).", "ok");
        return;
      }
      if(!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      dernierSha = data.sha;
      const contenu = JSON.parse(b64DecodeUnicode(data.content.replace(/\n/g,"")));
      const distants = Array.isArray(contenu.restaurants) ? contenu.restaurants : [];
      fusionner(distants);
      if(feedback) statut("Synchronisé depuis GitHub.", "ok");
    }catch(e){
      if(feedback) statut("Échec de la récupération GitHub : " + e.message, "err");
    }
  }

  function fusionner(distants){
    const parId = new Map(restaurants.map(r=>[r.id, r]));
    distants.forEach(d=>{
      const local = parId.get(d.id);
      if(!local){
        parId.set(d.id, d);
      }else{
        const majLocal = new Date(local.maj || 0).getTime();
        const majDist = new Date(d.maj || 0).getTime();
        if(majDist > majLocal) parId.set(d.id, d);
      }
    });
    restaurants = Array.from(parId.values());
    sauverLocal();
    toutRedessiner();
  }

  let pushTimer = null;
  function pousserVersGithubDifféré(){
    if(!cfgComplete()) return;
    if(pushTimer) clearTimeout(pushTimer);
    pushTimer = setTimeout(()=> pousserVersGithub(false), 1200);
  }

  async function pousserVersGithub(feedback){
    if(!cfgComplete()){
      if(feedback) statut("Identifiants GitHub incomplets.", "err");
      return;
    }
    if(feedback) statut("Envoi vers GitHub…");
    try{
      const contenu = {restaurants, maj: new Date().toISOString()};
      const body = {
        message: "Mise à jour restaurants.json",
        content: b64EncodeUnicode(JSON.stringify(contenu, null, 2)),
        branch: cfg.branch
      };
      if(dernierSha) body.sha = dernierSha;

      const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${FILE_NAME}`;
      const res = await fetch(url, {
        method: "PUT",
        headers: {
          "Authorization": `Bearer ${cfg.token}`,
          "Accept": "application/vnd.github+json",
          "Content-Type": "application/json"
        },
        body: JSON.stringify(body)
      });

      if(res.status === 409 || (res.status === 422 && dernierSha)){
        // conflit : on relit puis on retente une fois
        await chargerDepuisGithub(false);
        return pousserVersGithub(feedback);
      }
      if(!res.ok){
        const errTxt = await res.text();
        throw new Error("HTTP " + res.status + " " + errTxt.slice(0,120));
      }
      const data = await res.json();
      dernierSha = data.content.sha;
      if(feedback) statut("Envoyé vers GitHub.", "ok");
    }catch(e){
      if(feedback) statut("Échec de l'envoi GitHub : " + e.message, "err");
    }
  }

  // ---------- Démarrage ----------
  toutRedessiner();
  if(restaurants.length){
    const dernier = restaurants[restaurants.length - 1];
    map.setView([dernier.lat, dernier.lon], 14);
  }else if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      (pos)=> map.setView([pos.coords.latitude, pos.coords.longitude], 14),
      ()=>{}
    );
  }
  if(cfgComplete()) chargerDepuisGithub(false);

})();
</script>

<script>
(function(){
  "use strict";

  // Mêmes miroirs Overpass que l'application, pour un test représentatif.
  const DIAG_OVERPASS_ENDPOINTS = [
    "https://overpass-api.de/api/interpreter",
    "https://overpass.private.coffee/api/interpreter",
    "https://overpass.openstreetmap.ru/api/interpreter"
  ];
  // Coordonnées neutres (Paris) : seule la connectivité nous intéresse ici, pas le résultat.
  const DIAG_LAT = 48.8566, DIAG_LON = 2.3522;
  const DIAG_NOMINATIM_URL = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${DIAG_LAT}&lon=${DIAG_LON}&zoom=18`;
  const DIAG_REFERENCE_URL = "https://www.openstreetmap.org/favicon.ico";

  const btn = document.getElementById("btnDiagTest");
  const overlay = document.getElementById("diagOverlay");
  const pre = document.getElementById("diagReportText");
  const btnRelancer = document.getElementById("diagRelancer");
  const btnCopier = document.getElementById("diagCopier");
  const btnTelecharger = document.getElementById("diagTelecharger");
  const btnFermer = document.getElementById("diagFermer");
  const statusEl = document.getElementById("diagStatus");

  if(!btn || !overlay || !pre) return; // sécurité : si la modale n'existe pas, on ne fait rien.

  function fmtMs(ms){ return Math.round(ms) + " ms"; }

  function diagAvecTimeout(promesse, ms){
    return Promise.race([
      promesse,
      new Promise((_, rej) => setTimeout(()=> rej(new Error("Timeout dépassé (" + ms + " ms)")), ms))
    ]);
  }

  // Test "normal" : identique à ce que fait l'application (fetch classique, lecture de la réponse).
  async function diagFetchNormal(url, options, timeoutMs){
    const t0 = performance.now();
    try{
      const res = await diagAvecTimeout(fetch(url, options), timeoutMs);
      return { ok:true, status:res.status, duree: performance.now()-t0, erreur:null };
    }catch(e){
      return { ok:false, status:null, duree: performance.now()-t0, erreur:(e && e.message) || String(e) };
    }
  }

  // Test "no-cors" : on n'a pas le droit de LIRE la réponse, mais si la requête part quand
  // même et revient (même de façon opaque), cela prouve que le réseau/l'appareil laisse
  // passer la connexion — un échec ici, contrairement au test normal, pointe vers un blocage
  // local (extension, DNS, pare-feu) plutôt qu'un simple souci d'en-têtes CORS côté serveur.
  async function diagFetchNoCors(url, timeoutMs){
    const t0 = performance.now();
    try{
      await diagAvecTimeout(fetch(url, {mode:"no-cors", cache:"no-store"}), timeoutMs);
      return { ok:true, duree: performance.now()-t0, erreur:null };
    }catch(e){
      return { ok:false, duree: performance.now()-t0, erreur:(e && e.message) || String(e) };
    }
  }

  // Test de connectivité générique via une image (contourne les restrictions fetch/CORS).
  function diagTestImage(url, timeoutMs){
    return new Promise((resolve)=>{
      const t0 = performance.now();
      const img = new Image();
      let fini = false;
      const conclure = (ok, info)=>{
        if(fini) return;
        fini = true;
        resolve({ ok, duree: performance.now()-t0, info });
      };
      const minuteur = setTimeout(()=> conclure(false, "aucune réponse avant le délai"), timeoutMs);
      img.onload = ()=>{ clearTimeout(minuteur); conclure(true, "chargée avec succès"); };
      img.onerror = ()=>{ clearTimeout(minuteur); conclure(false, "erreur de chargement (réponse d'erreur reçue, ou bloqué)"); };
      img.src = url + (url.includes("?") ? "&" : "?") + "diagcachebuster=" + Date.now();
    });
  }

  async function diagTestGeoloc(){
    if(!navigator.geolocation){
      return { ok:false, erreur:"API de géolocalisation non disponible sur ce navigateur." };
    }
    const t0 = performance.now();
    return new Promise((resolve)=>{
      navigator.geolocation.getCurrentPosition(
        (pos)=> resolve({
          ok:true, duree: performance.now()-t0,
          lat: pos.coords.latitude, lon: pos.coords.longitude,
          precision: pos.coords.accuracy
        }),
        (err)=> resolve({ ok:false, duree: performance.now()-t0, erreur: err.message, code: err.code }),
        {enableHighAccuracy:true, timeout:12000, maximumAge:0}
      );
    });
  }

  function diagInfoEnvironnement(){
    const nav = navigator;
    const conn = nav.connection || nav.mozConnection || nav.webkitConnection;
    return {
      userAgent: nav.userAgent,
      plateforme: nav.platform || "(inconnue)",
      enLigne: nav.onLine,
      tactile: ("ontouchstart" in window) || (nav.maxTouchPoints > 0),
      cookiesActives: nav.cookieEnabled,
      protocole: location.protocol,
      largeurEcran: window.innerWidth + "x" + window.innerHeight,
      connexion: conn ? {
        type: conn.effectiveType,
        debit: conn.downlink + " Mbps",
        rtt: conn.rtt + " ms",
        economieDonnees: conn.saveData
      } : null
    };
  }

  function diagLigne(ok, texte){ return (ok ? "✅ " : "❌ ") + texte; }

  async function diagLancer(){
    btnRelancer.disabled = true;
    btn.disabled = true;
    statusEl.textContent = "Diagnostic en cours… (jusqu'à ~30 secondes selon le réseau)";

    const R = [];
    const maj = () => { pre.textContent = R.join("\n"); pre.scrollTop = pre.scrollHeight; };

    R.push("═══════════════════════════════════════════");
    R.push(" DIAGNOSTIC RÉSEAU — Application Restaurants");
    R.push("═══════════════════════════════════════════");
    R.push("Date : " + new Date().toLocaleString("fr-FR"));
    R.push("");

    // ---- 1. Environnement ----
    R.push("── 1. Environnement ──────────────────────");
    const env = diagInfoEnvironnement();
    R.push("Navigateur (userAgent) : " + env.userAgent);
    R.push("Plateforme déclarée    : " + env.plateforme);
    R.push("Écran                  : " + env.largeurEcran + (env.tactile ? " (tactile)" : " (non tactile)"));
    R.push("En ligne (navigator.onLine) : " + (env.enLigne ? "oui" : "NON ⚠️ le navigateur se pense hors-ligne"));
    R.push("Chargé via              : " + env.protocole + (env.protocole === "file:" ? "  ⚠️ fichier local — certains navigateurs appliquent des règles réseau différentes en file://" : ""));
    if(env.connexion){
      R.push("Type de connexion       : " + env.connexion.type);
      R.push("Débit estimé            : " + env.connexion.debit);
      R.push("Latence estimée (RTT)   : " + env.connexion.rtt);
      R.push("Économie de données     : " + (env.connexion.economieDonnees ? "activée ⚠️ (peut limiter certaines requêtes)" : "désactivée"));
    }else{
      R.push("Connexion réseau        : API Network Information non disponible (normal sur Safari/iOS)");
    }
    maj();

    // ---- 2. Géolocalisation ----
    R.push("");
    R.push("── 2. Géolocalisation ────────────────────");
    const geo = await diagTestGeoloc();
    if(geo.ok){
      R.push(diagLigne(true, "Position obtenue en " + fmtMs(geo.duree)));
      R.push("  Coordonnées        : " + geo.lat.toFixed(6) + ", " + geo.lon.toFixed(6));
      R.push("  Précision annoncée : " + Math.round(geo.precision) + " m");
    }else{
      R.push(diagLigne(false, "Échec (" + fmtMs(geo.duree||0) + ") : " + geo.erreur));
    }
    maj();

    // ---- 3. Référence qui fonctionne côté appli : Nominatim ----
    R.push("");
    R.push("── 3. Test Nominatim (reverse-geocoding — sert de référence \"ça marche\") ──");
    const nomTest = await diagFetchNormal(DIAG_NOMINATIM_URL, {headers:{"Accept":"application/json"}}, 8000);
    R.push(nomTest.ok
      ? diagLigne(true, "Réponse HTTP " + nomTest.status + " en " + fmtMs(nomTest.duree))
      : diagLigne(false, "Échec (" + fmtMs(nomTest.duree) + ") : " + nomTest.erreur));
    maj();

    // ---- 4. Référence générique hors-Overpass ----
    R.push("");
    R.push("── 4. Test de référence générique (openstreetmap.org, hors Overpass) ──");
    const refImg = await diagTestImage(DIAG_REFERENCE_URL, 6000);
    R.push(diagLigne(refImg.ok, refImg.info + " (" + fmtMs(refImg.duree) + ")"));
    maj();

    // ---- 5. Chaque miroir Overpass, sous 3 angles ----
    R.push("");
    R.push("── 5. Serveurs Overpass (recherche des restaurants) ──");
    const requeteTest = `[out:json][timeout:10];node(around:50,${DIAG_LAT},${DIAG_LON});out 1;`;
    const synthese = [];

    for(const endpoint of DIAG_OVERPASS_ENDPOINTS){
      R.push("");
      R.push("▸ " + endpoint);

      const rNormal = await diagFetchNormal(endpoint, {
        method: "POST",
        body: "data=" + encodeURIComponent(requeteTest)
      }, 8000);
      R.push("  a) Requête normale (comme l'appli)      : " +
        (rNormal.ok ? diagLigne(true, "OK — HTTP " + rNormal.status + " en " + fmtMs(rNormal.duree))
                    : diagLigne(false, "ÉCHEC en " + fmtMs(rNormal.duree) + " — " + rNormal.erreur)));
      maj();

      const rNoCors = await diagFetchNoCors(endpoint, 8000);
      R.push("  b) Requête sans lecture réponse (no-cors) : " +
        (rNoCors.ok ? diagLigne(true, "la requête atteint le serveur (" + fmtMs(rNoCors.duree) + ")")
                    : diagLigne(false, "n'atteint même pas le serveur (" + fmtMs(rNoCors.duree) + ") — " + rNoCors.erreur)));
      maj();

      if(!rNormal.ok && rNormal.duree < 200){
        R.push("  ⚠️ Échec quasi instantané (<200 ms) : typique d'un blocage LOCAL avant même l'envoi réseau (extension anti-pub/traqueurs, filtre DNS de la box/routeur, pare-feu). Un vrai souci serveur/réseau met généralement plus longtemps à échouer.");
      }else if(!rNormal.ok){
        R.push("  ℹ️ Échec après un délai notable : compatible avec un vrai souci réseau/serveur plutôt qu'un blocage local instantané.");
      }

      let verdict;
      if(rNormal.ok){
        verdict = "OK";
      }else if(rNoCors.ok){
        verdict = "Probable souci CORS côté serveur Overpass (il répond mais sans en-tête Access-Control-Allow-Origin correct) — pas un blocage de cet appareil";
      }else{
        verdict = "Probable blocage LOCAL (extension navigateur, filtre DNS réseau, pare-feu ou VPN) — la requête ne semble pas sortir";
      }
      R.push("  ➜ Verdict : " + verdict);
      synthese.push({endpoint, ok: rNormal.ok, verdict});
      maj();
    }

    // ---- 6. Synthèse ----
    R.push("");
    R.push("── 6. Synthèse et pistes ─────────────────");
    const nbOk = synthese.filter(s=>s.ok).length;
    const nbBloqueLocal = synthese.filter(s=>s.verdict.startsWith("Probable blocage LOCAL")).length;
    const nbCorsServeur = synthese.filter(s=>s.verdict.startsWith("Probable souci CORS")).length;

    R.push(nbOk + " / " + DIAG_OVERPASS_ENDPOINTS.length + " serveurs Overpass joignables normalement sur cet appareil, à cet instant.");
    if(nomTest.ok && nbOk < DIAG_OVERPASS_ENDPOINTS.length){
      R.push("Nominatim fonctionne mais pas (tous) les serveurs Overpass : la connectivité générale de cet appareil est bonne — le blocage cible spécifiquement les domaines Overpass.");
    }
    if(nbBloqueLocal === DIAG_OVERPASS_ENDPOINTS.length){
      R.push("→ Les 3 serveurs échouent y compris en no-cors : tout pointe vers un blocage LOCAL (cet appareil ou ce réseau), pas un souci des serveurs Overpass eux-mêmes.");
      R.push("  Pistes à tester dans l'ordre :");
      R.push("  1. Désactiver temporairement les extensions de blocage de pub/traqueurs (uBlock Origin, AdGuard, Privacy Badger, 1Blocker…), puis relancer ce test.");
      R.push("  2. Tester en navigation privée (désactive la plupart des extensions).");
      R.push("  3. Basculer du Wi-Fi vers le partage de connexion d'un téléphone (permet d'isoler un filtrage DNS de la box/routeur : Pi-hole, AdGuard Home, contrôle parental, proxy d'entreprise).");
      R.push("  4. Vérifier un pare-feu applicatif (Little Snitch, Lulu, pare-feu macOS) qui bloquerait le navigateur vers ces domaines.");
      R.push("  5. Vérifier qu'aucun VPN ni Relais Privé iCloud n'est actif et ne filtre ce trafic.");
    }else if(nbCorsServeur > 0){
      R.push("→ Au moins un serveur répond en no-cors mais pas en requête normale : problème d'en-têtes CORS côté serveur Overpass (les miroirs publics sont connus pour être instables), pas un blocage de votre appareil.");
    }else if(nbOk === DIAG_OVERPASS_ENDPOINTS.length){
      R.push("→ Tout fonctionne correctement sur cet appareil au moment du test.");
    }
    R.push("");
    R.push("Pour comparer avec un autre appareil : lancez ce même diagnostic dessus (bouton 🔧 Test), puis comparez les lignes ✅/❌ des deux rapports (utilisez Copier ou Télécharger pour les mettre côte à côte).");

    maj();
    statusEl.textContent = "Diagnostic terminé — " + new Date().toLocaleTimeString("fr-FR");
    btnRelancer.disabled = false;
    btn.disabled = false;
  }

  btn.addEventListener("click", ()=>{
    overlay.classList.add("open");
    diagLancer();
  });
  btnRelancer.addEventListener("click", diagLancer);
  btnFermer.addEventListener("click", ()=> overlay.classList.remove("open"));
  overlay.addEventListener("keydown", (ev)=>{ if(ev.key === "Escape") overlay.classList.remove("open"); });

  btnCopier.addEventListener("click", async ()=>{
    try{
      await navigator.clipboard.writeText(pre.textContent);
      statusEl.textContent = "Rapport copié dans le presse-papiers.";
    }catch(e){
      statusEl.textContent = "Copie automatique impossible — sélectionnez le texte manuellement.";
    }
  });

  btnTelecharger.addEventListener("click", ()=>{
    const blob = new Blob([pre.textContent], {type:"text/plain;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "diagnostic-restaurants-" + new Date().toISOString().replace(/[:.]/g,"-") + ".txt";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=> URL.revokeObjectURL(url), 2000);
  });

})();
</script>
</body>
</html>
