<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion de Restaurants - Leaflet</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; height: 100vh; display: flex; overflow: hidden; }
    
    #sidebar { width: 320px; background: #f8f9fa; border-right: 1px solid #dee2e6; display: flex; flex-direction: column; height: 100vh; }
    #sidebar-header { padding: 15px; border-bottom: 1px solid #dee2e6; background: #fff; }
    #sidebar-header h2 { font-size: 1.1rem; margin-bottom: 10px; }
    #listBody { flex: 1; overflow-y: auto; padding: 10px; }
    
    #map { flex: 1; height: 100vh; }

    /* Boutons et UI */
    .btn { padding: 8px 12px; font-size: 13px; border-radius: 4px; border: none; cursor: pointer; background: #0d6efd; color: #fff; }
    .btn:hover { background: #0b5ed7; }
    .btn-danger { background: #dc3545; color: white; border: none; padding: 3px 8px; border-radius: 3px; cursor: pointer; }
    .btn-danger:hover { background: #bb2d3b; }
    .btn-ghost { background: #e9ecef; color: #495057; border: 1px solid #ced4da; border-radius: 3px; font-size: 12px; }
    .btn-ghost:hover { background: #dee2e6; }
    .btn-small { padding: 4px 8px; font-size: 12px; }

    /* Éléments de la liste */
    .resto-item { background: #fff; border: 1px solid #ced4da; border-radius: 6px; padding: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: flex-start; cursor: pointer; }
    .resto-item.selected { border-color: #0d6efd; background: #f0f7ff; }
    .resto-item .txt { flex: 1; margin-right: 8px; }
    
    /* Field popup & list */
    .popup-field { margin-bottom: 6px; }
    .popup-label { font-size: 10px; text-transform: uppercase; color: #6c757d; font-weight: bold; }
    .popup-text { font-size: 13px; color: #212529; cursor: pointer; padding: 2px; border-radius: 3px; }
    .popup-text:hover { background: #e9ecef; }
    .popup-text.nom { font-weight: bold; }
    .popup-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding-top: 8px; border-top: 1px solid #eee; }
    .popup-date { font-size: 10px; color: #6c757d; }
    .empty-hint { font-size: 13px; color: #6c757d; text-align: center; margin-top: 20px; }
    
    /* Style champ d'édition rapide */
    .edit-input { width: 100%; font-size: 13px; padding: 2px 4px; border: 1px solid #0d6efd; border-radius: 3px; }
  </style>
</head>
<body>

  <div id="sidebar">
    <div id="sidebar-header">
      <h2>Restaurants (<span id="countLbl">0</span>)</h2>
      <button class="btn" id="btnAdd">➕ Nouveau restaurant</button>
    </div>
    <div id="listBody"></div>
  </div>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // --- Données & État ---
    let restaurants = [];
    let markersMap = new Map();
    let selectedId = null;

    // --- Initialisation Carte ---
    const map = L.map('map').setView([48.8566, 2.3522], 13); // Paris par défaut

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // --- Fonctions d'échappement et Utilitaires ---
    function escHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // --- Génération HTML Popup ---
    function popupHTML(r) {
      const dateAff = r.maj ? new Date(r.maj).toLocaleString("fr-FR") : "";
      const gmapsUrl = `https://www.google.com/maps/search/?api=1&query=${r.lat},${r.lon}`;
      const osmUrl = `https://www.openstreetmap.org/?mlat=${r.lat}&mlon=${r.lon}#map=18/${r.lat}/${r.lon}`;
      
      return `
        <div style="min-width: 200px;">
          <div class="popup-field">
            <div class="popup-label">Nom</div>
            <div class="popup-text nom" data-id="${r.id}" data-field="name">${escHtml(r.name || "Nouveau restaurant")}</div>
          </div>
          <div class="popup-field">
            <div class="popup-label">Adresse</div>
            <div class="popup-text adr" data-id="${r.id}" data-field="address">${escHtml(r.address || "(adresse non définie, double-cliquez pour saisir)")}</div>
          </div>
          <div class="popup-field" style="margin-top:8px; display:flex; gap:6px;">
            <a href="${gmapsUrl}" target="_blank" rel="noopener noreferrer" class="btn-ghost btn-small" style="text-decoration:none; text-align:center; flex:1;">📍 Google Maps</a>
            <a href="${osmUrl}" target="_blank" rel="noopener noreferrer" class="btn-ghost btn-small" style="text-decoration:none; text-align:center; flex:1;">🗺️ OSM</a>
          </div>
          <div class="popup-actions">
            <span class="popup-date">${dateAff}</span>
            <button class="btn-danger" data-del="${r.id}">Supprimer</button>
          </div>
        </div>
      `;
    }

    // --- Rafraîchissement Panneau Latéral ---
    function rafraichirListe() {
      const body = document.getElementById("listBody");
      document.getElementById("countLbl").textContent = restaurants.length;
      
      if (restaurants.length === 0) {
        body.innerHTML = '<div class="empty-hint">Aucun restaurant enregistré. Cliquez sur « Nouveau restaurant » ou sur la carte.</div>';
        return;
      }
      
      const tries = [...restaurants].sort((a, b) => (b.maj || "").localeCompare(a.maj || ""));
      
      body.innerHTML = tries.map(r => {
        const gmapsUrl = `https://www.google.com/maps/search/?api=1&query=${r.lat},${r.lon}`;
        const osmUrl = `https://www.openstreetmap.org/?mlat=${r.lat}&mlon=${r.lon}#map=18/${r.lat}/${r.lon}`;
        return `
          <div class="resto-item${r.id === selectedId ? ' selected' : ''}" data-goto="${r.id}">
            <div class="txt">
              <div class="popup-text nom" data-id="${r.id}" data-field="name">${escHtml(r.name || "Nouveau restaurant")}</div>
              <div class="popup-text adr" data-id="${r.id}" data-field="address">${escHtml(r.address || "adresse non définie")}</div>
              <div style="margin-top:6px; display:flex; gap:6px;">
                <a href="${gmapsUrl}" target="_blank" rel="noopener noreferrer" class="btn-ghost" style="padding:2px 6px; font-size:11px; text-decoration:none;">📍 Google Maps</a>
                <a href="${osmUrl}" target="_blank" rel="noopener noreferrer" class="btn-ghost" style="padding:2px 6px; font-size:11px; text-decoration:none;">🗺️ OSM</a>
              </div>
            </div>
            <button class="btn-danger" data-del="${r.id}">✕</button>
          </div>
        `;
      }).join("");

      // Événements liste
      body.querySelectorAll("[data-goto]").forEach(el => {
        el.addEventListener("click", (ev) => {
          if (ev.target.closest("[data-del]") || ev.target.closest(".popup-text") || ev.target.closest("a")) return;
          definirSelection(el.getAttribute("data-goto"), { pan: true });
        });
      });

      body.querySelectorAll("[data-del]").forEach(el => {
        el.addEventListener("click", (ev) => {
          ev.stopPropagation();
          supprimerRestaurant(el.getAttribute("data-del"));
        });
      });

      body.querySelectorAll(".popup-text").forEach(el => {
        el.ondblclick = (ev) => {
          ev.stopPropagation();
          passerEnEdition(el);
        };
      });
    }

    // --- Gestion des Marqueurs et Sélection ---
    function ajouterMarqueur(r) {
      const marker = L.marker([r.lat, r.lon]).addTo(map);
      marker.bindPopup(() => popupHTML(r));
      
      marker.on("click", () => {
        definirSelection(r.id, { pan: false });
      });

      marker.on("popupopen", () => {
        const popupEl = marker.getPopup().getElement();
        if (!popupEl) return;
        
        popupEl.querySelectorAll(".popup-text").forEach(el => {
          el.ondblclick = (ev) => {
            ev.stopPropagation();
            passerEnEdition(el);
          };
        });

        popupEl.querySelectorAll("[data-del]").forEach(el => {
          el.onclick = (ev) => {
            ev.stopPropagation();
            supprimerRestaurant(el.getAttribute("data-del"));
          };
        });
      });

      markersMap.set(r.id, marker);
    }

    function definirSelection(id, options = { pan: false }) {
      selectedId = id;
      const r = restaurants.find(x => x.id === id);
      if (!r) return;

      if (options.pan) {
        map.panTo([r.lat, r.lon]);
        const m = markersMap.get(id);
        if (m) m.openPopup();
      }
      rafraichirListe();
    }

    // --- Modificateurs de données (CRUD) ---
    function ajouterRestaurant(lat, lon) {
      const id = "resto_" + Date.now();
      const nouveau = {
        id: id,
        name: "Nouveau restaurant",
        address: "",
        lat: lat,
        lon: lon,
        maj: new Date().toISOString()
      };
      
      restaurants.push(nouveau);
      ajouterMarqueur(nouveau);
      definirSelection(id, { pan: true });
    }

    function supprimerRestaurant(id) {
      restaurants = restaurants.filter(r => r.id !== id);
      const marker = markersMap.get(id);
      if (marker) {
        map.removeLayer(marker);
        markersMap.delete(id);
      }
      if (selectedId === id) selectedId = null;
      rafraichirListe();
    }

    function passerEnEdition(el) {
      const id = el.getAttribute("data-id");
      const field = el.getAttribute("data-field");
      const r = restaurants.find(x => x.id === id);
      if (!r) return;

      const currentValue = r[field] || "";
      const input = document.createElement("input");
      input.type = "text";
      input.className = "edit-input";
      input.value = currentValue;

      el.replaceWith(input);
      input.focus();

      function valider() {
        r[field] = input.value.trim();
        r.maj = new Date().toISOString();
        
        // Mettre à jour le popup du marqueur
        const marker = markersMap.get(id);
        if (marker) {
          marker.setPopupContent(popupHTML(r));
        }
        rafraichirListe();
      }

      input.addEventListener("blur", valider);
      input.addEventListener("keydown", (ev) => {
        if (ev.key === "Enter") valider();
      });
    }

    // --- Événements globaux ---
    document.getElementById("btnAdd").addEventListener("click", () => {
      const center = map.getCenter();
      ajouterRestaurant(center.lat, center.lng);
    });

    map.on("click", (e) => {
      // Optionnel : ajouter au clic sur la carte
      ajouterRestaurant(e.latlng.lat, e.latlng.lng);
    });
  </script>
</body>
</html>
