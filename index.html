<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Restaurants</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{
    --bg:#f6f4ef;
    --panel:#ffffff;
    --ink:#1f2320;
    --muted:#6b6f6a;
    --accent:#c1502e;
    --accent-ink:#ffffff;
    --line:#e3e0d6;
    --ok:#2f7a4f;
    --err:#b3341c;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);
    color:var(--ink);
    display:flex;
    flex-direction:column;
    overscroll-behavior:none;
    touch-action:manipulation; /* bloque le zoom natif au double-tap (que iOS applique malgré user-scalable=no), sans gêner le pincement (pinch-zoom) */
  }

  header{
    background:var(--panel);
    border-bottom:1px solid var(--line);
    padding:10px 12px;
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    position:relative;
    z-index:1000;
  }
  header h1{
    font-size:17px;
    margin:0;
    font-weight:700;
    letter-spacing:.2px;
    flex:0 0 auto;
  }
  .badge{
    font-size:10px;
    color:var(--muted);
    border:1px solid var(--line);
    border-radius:20px;
    padding:1px 7px;
    cursor:pointer;
    user-select:none;
  }
  .spacer{flex:1 1 auto;}

  button{
    font:inherit;
    border:none;
    border-radius:9px;
    padding:9px 14px;
    cursor:pointer;
    font-weight:600;
    font-size:14px;
  }
  .btn-primary{
    background:var(--accent);
    color:var(--accent-ink);
  }
  .btn-primary:disabled{opacity:.55;cursor:default;}
  .btn-ghost{
    background:transparent;
    color:var(--ink);
    border:1px solid var(--line);
  }
  #btnSettings, #btnDiagTest{display:none;}
  body.mode-modif #btnSettings, body.mode-modif #btnDiagTest{display:inline-block;}
  #chkAfficherLogWrap{
    display:none;
    align-items:center;
    gap:5px;
    font-size:12px;
    color:var(--muted);
    user-select:none;
    cursor:pointer;
    flex:0 0 auto;
  }
  body.mode-modif #chkAfficherLogWrap{display:inline-flex;}
  #chkAfficherLogWrap input{margin:0;cursor:pointer;}
  #btnModifier.active{
    background:var(--accent);
    color:#fff;
    border-color:var(--accent);
  }
  .btn-danger{
    background:transparent;
    color:var(--err);
    border:1px solid var(--err);
    padding:5px 9px;
    font-size:12px;
  }
  .btn-small{
    padding:5px 9px;
    font-size:12px;
  }
  .btn-move{
    background:transparent;
    color:var(--muted);
    border:1px solid var(--line);
    padding:5px 9px;
    font-size:12px;
    flex:none;
  }
  .btn-move.active{
    background:var(--ok);
    color:#fff;
    border-color:var(--ok);
  }
  .btn-edit{
    background:transparent;
    color:var(--muted);
    border:1px solid var(--line);
    padding:5px 9px;
    font-size:12px;
    flex:none;
  }
  .btn-edit.active{
    background:var(--accent);
    color:#fff;
    border-color:var(--accent);
  }
  .list-edit-input{
    width:100%;
    display:block;
    font:inherit;
    font-size:13.5px;
    padding:4px 6px;
    border:1px solid var(--accent);
    border-radius:6px;
    margin-bottom:4px;
    box-sizing:border-box;
    touch-action:manipulation; /* évite que le double-tap iOS soit intercepté comme un zoom de page (cf. double-tap plein écran carte) */
    transition:font-size .12s ease, padding .12s ease, height .12s ease;
    resize:none;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    line-height:1.35;
    height:26px;
  }
  .list-edit-input:last-child{margin-bottom:0;}
  .list-edit-input.adr-input{font-size:12px;height:24px;}
  .list-edit-input.expanded{
    font-size:16px; /* >=16px : empêche aussi Safari iOS de zoomer la page au focus */
    padding:10px 12px;
    border-width:2px;
    white-space:pre-wrap;
    word-break:break-word;
    overflow-y:auto;
    text-overflow:clip;
    min-height:70px;
    height:auto;
  }

  #statusLine{
    font-size:12px;
    color:var(--muted);
    padding:0 12px 8px;
    min-height:14px;
  }
  #statusLine.err{color:var(--err);}
  #statusLine.ok{color:var(--ok);}

  #settings{
    background:var(--panel);
    border-bottom:1px solid var(--line);
    padding:12px;
    display:none;
    gap:8px;
    flex-direction:column;
    font-size:13px;
  }
  #settings.open{display:flex;}
  #settings label{
    display:flex;
    flex-direction:column;
    gap:3px;
    color:var(--muted);
    font-size:12px;
  }
  #settings input{
    font:inherit;
    padding:8px 9px;
    border:1px solid var(--line);
    border-radius:7px;
    background:#fff;
  }
  .settings-row{display:flex;gap:8px;flex-wrap:wrap;}
  .settings-row > label{flex:1 1 140px;}
  .settings-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px;}

  #main{
    flex:1 1 auto;
    display:flex;
    min-height:0;
  }
  #map{
    flex:1 1 auto;
    min-width:0;
  }

  /* Panneau de debug (temporaire) — pleine largeur, sous #main. Reste visible même en mode
     plein écran carte : c'est justement ce cas qu'il sert à déboguer. */
  #debugLogPanel{
    display:none;
    flex:0 0 auto;
    width:100%;
    box-sizing:border-box;
    border-top:2px solid #d97706;
    background:#1e1e1e;
    color:#d4d4d4;
  }
  body.show-debug-log #debugLogPanel{display:block;}
  #debugLogHeader{
    display:flex;
    align-items:center;
    gap:8px;
    padding:6px 10px;
    font-size:12px;
    font-weight:600;
    color:#facc15;
    background:#111;
  }
  #debugLogHeader button:first-of-type{
    margin-left:auto;
  }
  #debugLogHeader button{
    color:#fff;
    border-color:#555;
  }
  #debugLogBody{
    height:22vh;
    overflow-y:auto;
    padding:6px 10px 10px;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:11px;
    line-height:1.5;
    white-space:pre-wrap;
    word-break:break-word;
  }
  #debugLogBody.flash{ background:#2b2b1a; }

  /* Mode plein écran de la carte (basculé au double-clic/double-tap sur la carte) */
  body.map-fullscreen header,
  body.map-fullscreen #statusLine,
  body.map-fullscreen #settings,
  body.map-fullscreen #listPanel{
    display:none !important;
  }

  #listPanel{
    width:290px;
    flex:0 0 auto;
    background:var(--panel);
    border-left:1px solid var(--line);
    overflow-y:auto;
    display:flex;
    flex-direction:column;
  }
  #listPanel h2{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.6px;
    color:var(--muted);
    margin:0;
    padding:12px 12px 6px;
    cursor:pointer;
  }
  #listeNomLbl{
    text-transform:none;
    letter-spacing:normal;
    font-weight:600;
    color:var(--ink);
  }
  /* Sélecteur rapide de liste : remplace #listeNomLbl en place au clic sur la ligne du titre,
     sans ajouter de bloc ni changer la hauteur du panneau (contrairement à #listeHeaderCombo,
     réservé au mode Modifier). Dimensions volontairement proches de #listeNomLbl. */
  #selectListeInline{
    display:none;
    font:inherit;
    font-size:12px;
    text-transform:none;
    letter-spacing:normal;
    font-weight:600;
    color:var(--ink);
    background:#fff;
    border:1px solid var(--line);
    border-radius:5px;
    padding:0 3px;
    max-width:150px;
    vertical-align:baseline;
    cursor:pointer;
  }
  /* Combo box "liste actuelle" + bouton "Nouvelle liste", affichés uniquement en mode Modifier,
     à la place du titre "Liste (N)". */
  #listeHeaderCombo{
    display:none;
    flex-direction:column;
    gap:6px;
    padding:10px 12px 8px;
    border-bottom:1px solid var(--line);
  }
  body.mode-modif #listPanel h2{display:none;}
  body.mode-modif #listeHeaderCombo{display:flex;}
  #listeHeaderCombo select{
    font:inherit;
    font-size:13px;
    padding:7px 8px;
    border:1px solid var(--line);
    border-radius:7px;
    background:#fff;
  }
  #listeHeaderCombo .btn-ghost{
    align-self:flex-start;
    font-size:12px;
    padding:6px 10px;
  }
  /* Combo box "liste" de chaque item, affichée uniquement en mode Modifier. */
  .item-liste-row{
    display:none;
    align-items:center;
    gap:6px;
    margin-top:6px;
  }
  body.mode-modif .item-liste-row{display:flex;}
  .item-liste-row .item-liste-label{
    font-size:11px;
    color:var(--muted);
    flex:none;
  }
  .item-liste-row select{
    font:inherit;
    font-size:12px;
    padding:4px 6px;
    border:1px solid var(--line);
    border-radius:6px;
    background:#fff;
    min-width:0;
    flex:1 1 auto;
  }
  .empty-hint{
    padding:10px 12px;
    font-size:13px;
    color:var(--muted);
  }
  .resto-item{
    padding:10px 12px;
    border-top:1px solid var(--line);
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    gap:8px;
    align-items:flex-start;
  }
  .resto-item:hover{background:#faf8f3;}
  .resto-item.selected{
    background:#faf0ea;
    border-left:3px solid var(--accent);
    padding-left:9px;
  }
  .resto-item .txt{min-width:0;}
  .resto-item .actions{display:none;gap:6px;align-items:center;flex:none;}
  body.mode-modif .resto-item .actions{display:flex;}
  .resto-item .nom{
    font-weight:600;
    font-size:13.5px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .resto-item .adr{
    font-size:12px;
    color:var(--muted);
    margin-top:2px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  @media (max-width:720px){
    #main{flex-direction:column;}
    #listPanel{
      width:auto;
      max-height:34vh;
      border-left:none;
      border-top:1px solid var(--line);
    }
  }

  /* Marker */
  .resto-pin{
    background:var(--accent);
    width:30px;height:30px;border-radius:50% 50% 50% 0;
    transform:rotate(-45deg);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 1px 4px rgba(0,0,0,.35);
    border:2px solid #fff;
  }
  .resto-pin span{
    transform:rotate(45deg);
    font-size:14px;
  }
  .resto-pin.selected{
    box-shadow:0 0 0 4px rgba(193,80,46,.4), 0 1px 4px rgba(0,0,0,.35);
  }
  .resto-pin.movable{
    background:var(--ok);
    box-shadow:0 0 0 4px rgba(47,122,79,.4), 0 1px 4px rgba(0,0,0,.35);
    cursor:grab;
  }

  /* Popup */
  .leaflet-popup-content{margin:10px 12px;min-width:190px;}
  .popup-field{margin-bottom:6px;}
  .popup-label{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);}
  .popup-text{
    font-size:14px;
    cursor:text;
    border-bottom:1px dashed transparent;
    padding:1px 0;
    touch-action:manipulation; /* évite que le double-tap iOS soit intercepté comme un zoom de page */
  }
  .popup-text:hover{border-bottom-color:var(--line);}
  .popup-text.nom{font-weight:700;font-size:15px;}
  .popup-maps-link{
    display:inline-block;
    font-size:12px;
    font-weight:600;
    color:var(--accent);
    text-decoration:none;
    margin-top:2px;
  }
  .popup-maps-link:hover{text-decoration:underline;}
  .popup-edit{
    width:100%;
    font:inherit;
    font-size:16px; /* >=16px : empêche Safari iOS de zoomer automatiquement la page au focus du champ */
    padding:4px 6px;
    border:1px solid var(--accent);
    border-radius:6px;
  }
  .popup-actions{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:8px;
    padding-top:6px;
    border-top:1px solid var(--line);
  }
  .popup-actions .btn-danger{display:none;}
  body.mode-modif .popup-actions .btn-danger{display:inline-block;}
  .popup-date{font-size:10px;color:var(--muted);}

  /* Modale de confirmation */
  .modal-overlay{
    position:fixed;inset:0;
    background:rgba(20,18,14,.45);
    display:flex;align-items:center;justify-content:center;
    z-index:3000;
    padding:16px;
    opacity:0;
    pointer-events:none;
    transition:opacity .15s ease;
  }
  .modal-overlay.open{opacity:1;pointer-events:auto;}
  .modal-box{
    background:var(--panel);
    border-radius:12px;
    padding:18px;
    width:100%;
    max-width:340px;
    box-shadow:0 10px 40px rgba(0,0,0,.35);
  }
  .modal-box h3{margin:0 0 4px;font-size:15px;}
  .modal-hint{font-size:11.5px;color:var(--muted);margin:0 0 12px;}
  .modal-maps-link{
    display:none; /* affiché en JS uniquement quand un restaurant a été trouvé */
    font-size:12px;
    color:var(--accent);
    text-decoration:none;
    margin:-6px 0 12px;
    font-weight:600;
  }
  .modal-maps-link:hover{text-decoration:underline;}
  .modal-box label{
    display:flex;flex-direction:column;gap:4px;
    font-size:12px;color:var(--muted);
    margin-bottom:10px;
  }
  .modal-box input, .modal-box select{
    font:inherit;padding:8px 9px;border:1px solid var(--line);border-radius:7px;background:#fff;
  }
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:4px;}
  .modal-actions-centre{justify-content:center;margin-top:14px;}

  .modal-box-attente{max-width:260px;text-align:center;}
  #attenteTexte{font-size:14px;color:var(--ink);}
  #attenteChrono{font-size:12px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums;}
  .spinner{
    width:32px;height:32px;
    border:3px solid var(--line);
    border-top-color:var(--accent);
    border-radius:50%;
    margin:0 auto 12px;
    animation:tourner .8s linear infinite;
  }
  @keyframes tourner{ to{ transform:rotate(360deg); } }
</style>

<!-- ===== Bloc TEST/DIAGNOSTIC (ajouté, n'affecte pas le reste de l'application) ===== -->
<style>
  .modal-box-diag{max-width:640px;width:96vw;}
  .diag-report{
    background:#faf8f3;
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px 12px;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:11.5px;
    line-height:1.5;
    white-space:pre-wrap;
    word-break:break-word;
    max-height:55vh;
    overflow-y:auto;
    margin:8px 0 4px;
  }
</style>
</head>
<body>

<header>
  <h1>🍽️ Restaurants</h1>
  <span class="badge" id="versionBadge" title="Historique des versions">V1</span>
  <div class="spacer"></div>
  <button class="btn-ghost" id="btnSettings">⚙️ GitHub</button>
  <button class="btn-ghost" id="btnDiagTest" title="Diagnostic réseau détaillé (Overpass, géolocalisation, etc.)">🔧 Test</button>
  <button class="btn-ghost" id="btnModifier">✏️ Modifier</button>
  <label id="chkAfficherLogWrap" title="Afficher/masquer le panneau de debug en bas de l'écran">
    <input type="checkbox" id="chkAfficherLog"> 🐞 Log
  </label>
  <button class="btn-primary" id="btnNouveau">📍 Nouveau restaurant</button>
</header>

<div id="statusLine"></div>

<div id="settings">
  <div class="settings-row">
    <label>Utilisateur / organisation GitHub
      <input type="text" id="cfgOwner" autocomplete="off" placeholder="ex. hammerinhank">
    </label>
    <label>Dépôt
      <input type="text" id="cfgRepo" autocomplete="off" placeholder="ex. restaurant">
    </label>
    <label>Branche
      <input type="text" id="cfgBranch" autocomplete="off" placeholder="main" value="main">
    </label>
  </div>
  <div class="settings-row">
    <label>Jeton d'accès personnel (PAT)
      <input type="password" id="cfgToken" autocomplete="off" placeholder="ghp_...">
    </label>
  </div>
  <div class="settings-actions">
    <button class="btn-primary btn-small" id="btnSaveCfg">Enregistrer les identifiants</button>
    <button class="btn-ghost btn-small" id="btnClearCfg">Effacer les identifiants</button>
    <button class="btn-ghost btn-small" id="btnPush">⬆️ Envoyer vers GitHub</button>
    <button class="btn-ghost btn-small" id="btnPull">⬇️ Récupérer depuis GitHub</button>
  </div>
</div>

<div id="main">
  <div id="map"></div>
  <div id="listPanel">
    <h2 id="listeTitreH2" title="Cliquer pour changer de liste">Liste (<span id="countLbl">0</span>) <span id="listeNomLbl"></span><select id="selectListeInline"></select></h2>
    <div id="listeHeaderCombo">
      <select id="selectListeActuelle" title="Liste affichée"></select>
      <button class="btn-ghost" id="btnNouvelleListe">+ Nouvelle liste</button>
    </div>
    <div id="listBody"></div>
  </div>
</div>

<!-- Panneau de debug (temporaire) : journalise chaque clic/tap sur l'écran avec des informations
     utiles au diagnostic. Bouton « Copier » pour copier tout le journal dans le presse-papier.
     Reste visible même en plein écran carte (utile pour déboguer justement ce cas). -->
<div id="debugLogPanel">
  <div id="debugLogHeader">
    🐞 Debug — <span id="debugLogCount">0</span> ligne(s)
    <button class="btn-ghost btn-small" id="btnDebugLogCopier">📋 Copier</button>
    <button class="btn-ghost btn-small" id="btnDebugLogClear">Effacer</button>
  </div>
  <div id="debugLogBody"></div>
</div>

<div class="modal-overlay" id="attenteOverlay">
  <div class="modal-box modal-box-attente">
    <div class="spinner" aria-hidden="true"></div>
    <div id="attenteTexte">Recherche en cours…</div>
    <div id="attenteChrono">0 s</div>
    <div class="modal-actions modal-actions-centre">
      <button class="btn-ghost btn-small" id="attenteAnnuler">Annuler</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <h3>Confirmer le restaurant</h3>
    <div class="modal-hint" id="modalHint"></div>
    <a id="modalMapsLink" class="modal-maps-link" href="#" target="_blank" rel="noopener">Voir la fiche sur Google Maps ↗</a>
    <label>Nom
      <input type="text" id="modalNom" autocomplete="off">
    </label>
    <label id="modalAlternativesChamp">Autres restaurants à proximité
      <select id="modalAlternatives"></select>
    </label>
    <label>Adresse
      <input type="text" id="modalAdresse" autocomplete="off">
    </label>
    <div class="modal-actions">
      <button class="btn-ghost btn-small" id="modalAnnuler">Ignorer</button>
      <button class="btn-primary btn-small" id="modalValider">Valider</button>
    </div>
  </div>
</div>

<!-- ===== Bloc TEST/DIAGNOSTIC : modale de rapport (ajoutée) ===== -->
<div class="modal-overlay" id="diagOverlay">
  <div class="modal-box modal-box-diag">
    <h3>🔧 Diagnostic réseau</h3>
    <div class="modal-hint" id="diagStatus">Prêt.</div>
    <pre id="diagReportText" class="diag-report">Cliquez sur « Relancer » pour lancer le diagnostic.</pre>
    <div class="modal-actions">
      <button class="btn-ghost btn-small" id="diagCopier">📋 Copier</button>
      <button class="btn-ghost btn-small" id="diagTelecharger">💾 Télécharger (.txt)</button>
      <button class="btn-ghost btn-small" id="diagRelancer">🔄 Relancer</button>
      <button class="btn-primary btn-small" id="diagFermer">Fermer</button>
    </div>
  </div>
</div>

<!-- ===== Historique des versions ===== -->
<div class="modal-overlay" id="historyOverlay">
  <div class="modal-box modal-box-diag">
    <h3>🕒 Historique des versions</h3>
    <div class="modal-hint">Résumé des modifications apportées à chaque version.</div>
    <div id="historyBody" class="diag-report"></div>
    <div class="modal-actions">
      <button class="btn-primary btn-small" id="historyFermer">Fermer</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
  "use strict";

  const VERSION = "V28";
  document.getElementById("versionBadge").textContent = VERSION;

  // Historique des versions : résumé des modifications apportées à chaque version,
  // affiché dans une modale au clic sur le badge de version.
  const HISTORIQUE_VERSIONS = [
    { v:"V1", resume:[
      "Carte Leaflet/OpenStreetMap avec bouton de géolocalisation.",
      "Reverse geocoding Nominatim (nom + adresse).",
      "Édition inline par double-clic dans le popup du marqueur.",
      "Liste latérale des restaurants avec suppression.",
      "Persistance localStorage + synchronisation GitHub (restaurants.json)."
    ]},
    { v:"V2", resume:[
      "Clic sur une ligne de la liste : sélectionne le restaurant (surbrillance liste + icône).",

  function afficherHistoriqueVersions(){
    const body = document.getElementById("historyBody");
    if(!body) return;
    body.textContent = [...HISTORIQUE_VERSIONS].reverse().map(entry =>
      entry.v + (entry.v === VERSION ? " (version actuelle)" : "") + "\n" +
      entry.resume.map(ligne => "  • " + ligne).join("\n")
    ).join("\n\n");
    document.getElementById("historyOverlay").classList.add("open");
  }
  document.getElementById("versionBadge").addEventListener("click", afficherHistoriqueVersions);
  document.getElementById("historyFermer").addEventListener("click", ()=>{
    document.getElementById("historyOverlay").classList.remove("open");
  });
  document.getElementById("historyOverlay").addEventListener("keydown", (ev)=>{
    if(ev.key === "Escape") document.getElementById("historyOverlay").classList.remove("open");
  });

  const LS_DATA_KEY = "restaurants.v1";
  const LS_SUPPR_KEY = "restaurantsSuppressions.v1";
  const LS_CFG_KEY = "restaurantsGithubConfig.v1";
  const LS_LISTES_KEY = "restaurantsListes.v1";
  const LS_LISTE_ACTUELLE_KEY = "restaurantsListeActuelle.v1";
  const LS_AFFICHER_LOG_KEY = "restaurantsAfficherLog.v1";
  const SS_MODIF_KEY = "restaurantsModifApresRechargement";

  // ---------- État ----------
  let restaurants = chargerLocal();   // [{id, lat, lon, name, address, maj}]
  let suppressions = chargerSuppressionsLocal(); // [{id, maj}] — traces des suppressions, pour que
                                       // celles-ci se propagent bien via GitHub vers les autres appareils
                                       // (sans cela, un restaurant supprimé sur un appareil peut

  let cfg = chargerCfg();             // {owner, repo, branch, token}
  let listes = chargerListes();       // [nomListe, ...] — noms des listes connues (toujours au moins "")
  const _listeActuelleInit = chargerListeActuelle();
  let listeActuelle = _listeActuelleInit.nom;       // nom de la liste actuellement affichée/sélectionnée
  let listeActuelleMaj = _listeActuelleInit.maj;    // horodatage de la dernière sélection (pour la fusion GitHub)
  let markers = {};                   // id -> L.marker
  let dernierSha = null;              // sha du fichier GitHub connu
  let selectedId = null;              // id du restaurant sélectionné (surbrillance liste/carte)
  let deplacableId = null;            // id du restaurant actuellement déplaçable (bouton "Déplacer" activé)
  const editingIds = new Set();       // ids des restaurants actuellement en édition dans la liste latérale
  let deplacableTimer = null;         // minuteur de 10 s : au-delà, le restaurant redevient non déplaçable
  let deplacementEffectue = false;    // le restaurant déplaçable actuel a-t-il réellement été bougé ?
  let attenteControleur = null;       // AbortController de la recherche en cours (annulable)
  let attenteIntervalId = null;       // intervalle du chronomètre affiché dans la fenêtre d'attente

  // ---------- Persistance locale ----------
  function chargerLocal(){
    try{
      const raw = localStorage.getItem(LS_DATA_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  }
  function sauverLocal(){
    localStorage.setItem(LS_DATA_KEY, JSON.stringify(restaurants));
  }

  function chargerCfg(){
    try{
      const raw = localStorage.getItem(LS_CFG_KEY);
      return raw ? JSON.parse(raw) : {owner:"",repo:"",branch:"main",token:""};
    }catch(e){ return {owner:"",repo:"",branch:"main",token:""}; }

    localStorage.setItem(LS_CFG_KEY, JSON.stringify(cfg));

  // ---------- Listes (regroupement des restaurants) ----------
  // Un restaurant appartient toujours à une liste identifiée par son nom (r.liste), la liste
  // "" (chaîne vide) étant la liste par défaut. "listes" recense tous les noms de listes connus,
  // y compris ceux sans aucun restaurant pour l'instant (liste tout juste créée) — elle doit donc
  // être stockée séparément et pas seulement déduite des restaurants existants.
  function normaliserListes(arr){
    const s = new Set(Array.isArray(arr) ? arr.filter(n=>typeof n==="string") : []);
    s.add(""); // la liste par défaut existe toujours
    return Array.from(s);
  }
  function chargerListes(){
    try{
      const raw = localStorage.getItem(LS_LISTES_KEY);
      return normaliserListes(raw ? JSON.parse(raw) : []);
    }catch(e){ return [""]; }
  }
  function sauverListes(){
    localStorage.setItem(LS_LISTES_KEY, JSON.stringify(listes));
  }
  function chargerListeActuelle(){
    try{
      const raw = localStorage.getItem(LS_LISTE_ACTUELLE_KEY);
      const obj = raw ? JSON.parse(raw) : null;
      if(obj && typeof obj.nom === "string") return obj;
    }catch(e){}
    return {nom:"", maj:"1970-01-01T00:00:00.000Z"};
  }
  function sauverListeActuelle(){
    localStorage.setItem(LS_LISTE_ACTUELLE_KEY, JSON.stringify({nom:listeActuelle, maj:listeActuelleMaj}));
  }
  // Génère les <option> d'une combo box de listes, avec la valeur indiquée pré-sélectionnée.
  // Le nom "" (liste par défaut) apparaît volontairement comme une option vide dans la liste.
  function optionsListesHtml(valeurSelectionnee){
    return listes.map(nom =>
      `<option value="${escHtml(nom)}"${nom === (valeurSelectionnee||"") ? " selected" : ""}>${escHtml(nom)}</option>`
    ).join("");
  }
  // Ajoute un nom de liste s'il n'existe pas déjà.
  function ajouterListe(nom){
    if(!listes.includes(nom)){
      listes.push(nom);
      sauverListes();
    }
  }
  function remplirSelectListeActuelle(){
    const sel = document.getElementById("selectListeActuelle");
    if(!sel) return;
    sel.innerHTML = optionsListesHtml(listeActuelle);
    sel.value = listeActuelle;
  }

  // ---------- Journal de debug ----------
  // Panneau temporaire pleine largeur sous la liste : une ligne numérotée à chaque clic/tap
  // sur l'écran, avec les informations utiles au diagnostic du bug "clic proche d'une icône
  // sans effet sur iPhone". Bouton « Copier » dans le panneau pour copier tout le journal.
  let debugLogCompteur = 0;
  function debugLog(msg){
    debugLogCompteur++;
    const d = new Date();
    const heure = d.toTimeString().slice(0,8) + "." + String(d.getMilliseconds()).padStart(3,"0");
    const ligne = `#${debugLogCompteur} [${heure}] ${msg}`;
    const zone = document.getElementById("debugLogBody");
    if(zone){
      zone.textContent += (zone.textContent ? "\n" : "") + ligne;
      zone.scrollTop = zone.scrollHeight;
    }
    const cpt = document.getElementById("debugLogCount");
    if(cpt) cpt.textContent = debugLogCompteur;
  }
  document.addEventListener("click", (ev)=>{
    const cible = ev.target;
    const idOuClasse = cible.id ? "#" + cible.id : (cible.className && typeof cible.className === "string" && cible.className.trim() ? "." + cible.className.trim().split(/\s+/)[0] : "");
    const vv = window.visualViewport;
    debugLog(
      `clic DOM sur <${(cible.tagName||"?").toLowerCase()}${idOuClasse ? " " + idOuClasse : ""}> @ (${Math.round(ev.clientX)},${Math.round(ev.clientY)})` +
      ` — fenêtre ${window.innerWidth}x${window.innerHeight}` +
      (vv ? `, visualViewport ${Math.round(vv.width)}x${Math.round(vv.height)} décalage(${Math.round(vv.offsetLeft)},${Math.round(vv.offsetTop)})` : "") +
      `, scroll(${Math.round(window.scrollX)},${Math.round(window.scrollY)}), dpr=${window.devicePixelRatio}`
    );
  }, true);
  document.getElementById("btnDebugLogCopier").addEventListener("click", async ()=>{
    const zone = document.getElementById("debugLogBody");
    const texte = zone.textContent || "";
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        await navigator.clipboard.writeText(texte);
      }else{
        // Repli pour les contextes sans Clipboard API (ex. page non servie en HTTPS)
        const ta = document.createElement("textarea");
        ta.value = texte;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
      }
      zone.classList.add("flash");
      setTimeout(()=> zone.classList.remove("flash"), 400);
      debugLog("(journal copié dans le presse-papier)");
    }catch(e){
      debugLog("(échec de la copie : " + e.message + ")");
    }
  });
  document.getElementById("btnDebugLogClear").addEventListener("click", ()=>{
    debugLogCompteur = 0;
    document.getElementById("debugLogBody").textContent = "";
    document.getElementById("debugLogCount").textContent = "0";
  });

  // ---------- Statut ----------
  let statusTimer = null;
  function statut(msg, type){
    const el = document.getElementById("statusLine");
    el.textContent = msg || "";
    el.className = type || "";
    if(statusTimer) clearTimeout(statusTimer);
    if(msg){
      statusTimer = setTimeout(()=>{ el.textContent=""; el.className=""; }, 6000);
    }
  }

  // ---------- Carte ----------
  const map = L.map("map", {zoomControl:true, doubleClickZoom:false}).setView([46.6, 2.4], 6);

  // Correctif majeur : Leaflet mesure la taille de son conteneur une seule fois (à la création),
  // puis met en cache cette valeur pour tous ses calculs de position (popups, distances en
  // pixels...). Or sur iOS Safari, la hauteur réellement disponible change après coup (barre
  // d'adresse qui apparaît/disparaît), sans que Leaflet en soit informé — le journal de debug l'a
  // confirmé noir sur blanc : la carte y était mesurée à 471px de haut par Leaflet alors que son
  // conteneur ne faisait plus réellement que 82px, provoquant l'ouverture puis la fermeture
  // immédiate des popups, et sans doute aussi le mauvais calcul de distance pour la sélection
  // d'une icône par clic proche. On force donc explicitement map.invalidateSize() à chaque
  // occasion où cette hauteur peut avoir changé.
  function recalerTailleCarte(motif){
    const avant = map.getSize();
    map.invalidateSize({pan:false});
    const apres = map.getSize();
    if(avant.x !== apres.x || avant.y !== apres.y){
      debugLog(`recalage taille carte (${motif}) : ${avant.x}x${avant.y} → ${apres.x}x${apres.y}`);
    }
  }
  let recalageTimer = null;
  function recalerTailleCarteDifféré(motif){
    if(recalageTimer) clearTimeout(recalageTimer);
    recalageTimer = setTimeout(()=>{ recalageTimer = null; recalerTailleCarte(motif); }, 120);
  }
  window.addEventListener("resize", ()=> recalerTailleCarteDifféré("resize"));
  window.addEventListener("orientationchange", ()=> recalerTailleCarteDifféré("orientationchange"));
  if(window.visualViewport){
    window.visualViewport.addEventListener("resize", ()=> recalerTailleCarteDifféré("visualViewport resize"));
    window.visualViewport.addEventListener("scroll", ()=> recalerTailleCarteDifféré("visualViewport scroll"));
  }
  document.addEventListener("visibilitychange", ()=>{
    if(document.visibilityState === "visible") recalerTailleCarteDifféré("visibilitychange");
  });

  // Double-clic/double-tap sur la carte : bascule en plein écran (masque l'en-tête et la liste),
  // un nouveau double-clic revient à la présentation initiale.
  // Détection manuelle (deux "click" rapprochés) plutôt que l'événement natif "dblclick" :
  // sur iOS, ce dernier n'est pas toujours émis de façon fiable pour un double-tap, en particulier
  // une fois que le zoom Leaflet au double-clic (doubleClickZoom) est désactivé — Leaflet ne
  // synthétise alors plus cet événement à partir des taps. La détection via "click" fonctionne
  // de façon identique sur souris (desktop) et sur tap (mobile).
  //
  // Un clic "simple" confirmé (pas suivi d'un second clic dans le délai) déclenche par ailleurs
  // l'ouverture du popup du restaurant le plus proche du point cliqué, si un ou plusieurs se
  // trouvent à proximité immédiate — pratique pour viser une icône sans avoir à taper pile dessus.
  let mapClicTimer = null;
  let mapClicLatLng = null;
  const MAP_DBLCLIC_DELAI = 350; // ms — fenêtre de tolérance entre les deux taps/clics
  map.on("click", (ev)=>{
    if(mapClicTimer){
      clearTimeout(mapClicTimer);
      mapClicTimer = null;
      mapClicLatLng = null;
      debugLog("clic carte : 2e clic confirmé → double-clic → bascule plein écran");
      document.body.classList.toggle("map-fullscreen");
      // Laisser le temps au reflow (en-tête/liste masqués ou réaffichés) avant de recalculer
      // la taille interne de la carte, sinon Leaflet garde l'ancienne taille et affiche des tuiles manquantes.
      requestAnimationFrame(()=> requestAnimationFrame(()=> map.invalidateSize()));
    }else{
      // On mémorise la position géographique (latlng) du clic, pas sa position en pixels écran
      // (containerPoint) : sur iOS Safari, la barre d'adresse peut se réduire/apparaître entre le
      // clic et l'exécution différée ci-dessous (350 ms plus tard), ce qui décale les coordonnées
      // écran du conteneur de la carte — un containerPoint capturé au moment du clic ne
      // correspondrait alors plus au même point une fois ce délai écoulé. Le latlng, lui, ne
      // bouge pas : on reconvertit tout en pixels au moment de l'exécution, dans le même
      // référentiel que les icônes à cet instant-là.
      mapClicLatLng = ev.latlng;
      const rectAuClic = map.getContainer().getBoundingClientRect();
      debugLog(
        `clic carte : 1er clic — latlng=(${ev.latlng.lat.toFixed(6)},${ev.latlng.lng.toFixed(6)}), ` +
        `containerPoint=(${ev.containerPoint.x.toFixed(0)},${ev.containerPoint.y.toFixed(0)}), ` +
        `conteneur carte @ (${rectAuClic.left.toFixed(0)},${rectAuClic.top.toFixed(0)}) ${rectAuClic.width.toFixed(0)}x${rectAuClic.height.toFixed(0)} — ` +
        `attente ${MAP_DBLCLIC_DELAI}ms pour confirmer clic simple…`
      );
      mapClicTimer = setTimeout(()=>{
        mapClicTimer = null;
        selectionnerRestoProcheDuClic(mapClicLatLng);
        mapClicLatLng = null;
      }, MAP_DBLCLIC_DELAI);
    }
  });
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: "&copy; contributeurs OpenStreetMap"
  }).addTo(map);

  function iconResto(selectionne, deplacable){
    let cls = "resto-pin";
    if(selectionne) cls += " selected";
    if(deplacable) cls += " movable";
    return L.divIcon({
      className: "",
      html: `<div class="${cls}"><span>🍽️</span></div>`,
      iconSize: [30,30],
      iconAnchor: [15,29],
      popupAnchor: [0,-28]
    });
  }

  function idUnique(){
    return "r_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,8);
  }

  // Sélectionne (et ouvre le popup de) le restaurant dont l'icône est la plus proche du point
  // cliqué sur la carte, à condition qu'il se trouve à proximité immédiate — évite d'avoir à
  // viser précisément la petite icône, en particulier au doigt sur mobile ou quand plusieurs
  // icônes sont proches les unes des autres (on ouvre alors celle la plus proche du clic).
  const RAYON_CLIC_PROCHE_PX = 40; // tolérance en pixels écran autour du point cliqué
  function selectionnerRestoProcheDuClic(latlngClic){
    if(!latlngClic){
      debugLog("clic carte (différé) : pas de latlng mémorisé, abandon.");
      return;
    }
    recalerTailleCarte("avant calcul clic proche");
    const pointClic = map.latLngToContainerPoint(latlngClic);
    const rect = map.getContainer().getBoundingClientRect();
    const nbMarqueurs = Object.keys(markers).length;
    let meilleurId = null;
    let meilleureDistance = Infinity;
    const detail = [];
    Object.keys(markers).forEach(id=>{
      const pointMarqueur = map.latLngToContainerPoint(markers[id].getLatLng());
      const d = pointClic.distanceTo(pointMarqueur);
      const r = restaurants.find(x=>x.id===id);
      detail.push(`"${(r && r.name) || id}"=${d.toFixed(0)}px`);
      if(d < meilleureDistance){
        meilleureDistance = d;
        meilleurId = id;
      }
    });
    const meilleurResto = meilleurId ? restaurants.find(x=>x.id===meilleurId) : null;
    debugLog(
      `clic carte (différé, ${MAP_DBLCLIC_DELAI}ms plus tard) : point écran recalculé=(${pointClic.x.toFixed(0)},${pointClic.y.toFixed(0)}), ` +
      `conteneur carte @ (${rect.left.toFixed(0)},${rect.top.toFixed(0)}) ${rect.width.toFixed(0)}x${rect.height.toFixed(0)}, ` +
      `${nbMarqueurs} icône(s) affichée(s)` + (detail.length ? ` [${detail.join(", ")}]` : "")
    );
    if(meilleurId && meilleureDistance <= RAYON_CLIC_PROCHE_PX){
      debugLog(`→ sélection retenue : "${(meilleurResto && meilleurResto.name) || meilleurId}" à ${meilleureDistance.toFixed(0)}px (seuil ${RAYON_CLIC_PROCHE_PX}px)`);
      definirSelection(meilleurId);
    }else{
      debugLog(`→ aucune icône retenue (plus proche : "${(meilleurResto && meilleurResto.name) || "—"}" à ${isFinite(meilleureDistance) ? meilleureDistance.toFixed(0)+"px" : "∞"}, seuil ${RAYON_CLIC_PROCHE_PX}px)`);
    }
  }

  // Détection manuelle de double-clic/double-tap (même technique que pour le plein écran
  // de la carte) : plus fiable que l'événement natif "dblclick" sur iOS/Safari, qui n'est
  // pas toujours émis de façon fiable pour un double-tap. Fonctionne à l'identique sur
  // souris (desktop) et au doigt (mobile) puisqu'elle se base sur deux "click" rapprochés.
  const DBLTAP_DELAI = 350; // ms — fenêtre de tolérance entre les deux taps/clics
  function surDoubleTap(el, callback){
    let timer = null;
    el.addEventListener("click", ()=>{
      if(timer){
        clearTimeout(timer);
        timer = null;
        callback();
      }else{
        timer = setTimeout(()=>{ timer = null; }, DBLTAP_DELAI);
      }
    });
  }

  // Fait grandir une textarea pour épouser tout son contenu (utilisé pour les champs
  // d'édition de la liste une fois agrandis, afin d'éditer confortablement les lignes longues).
  function ajusterHauteurAuto(el){
    el.style.height = "auto";
    el.style.height = el.scrollHeight + "px";
  }

  // ---------- Rendu ----------
  function popupHTML(r){
    const dateAff = new Date(r.maj).toLocaleString("fr-FR");
    const lienMaps = urlGoogleMaps(r.name, r.lat, r.lon);
    return `
      <div class="popup-field">
        <div class="popup-label">Nom</div>
        <div class="popup-text nom" data-id="${r.id}" data-field="name">${escHtml(r.name || "Nouveau restaurant")}</div>
      </div>
      <div class="popup-field">
        <div class="popup-label">Adresse</div>
        <div class="popup-text adr" data-id="${r.id}" data-field="address">${escHtml(r.address || "(adresse non définie, double-cliquez pour saisir)")}</div>
      </div>
      ${lienMaps ? `<a class="popup-maps-link" href="${lienMaps}" target="_blank" rel="noopener">Voir la fiche sur Google Maps ↗</a>` : ""}
      <div class="popup-actions">
        <span class="popup-date">${dateAff}</span>
        <button class="btn-danger" data-del="${r.id}">Supprimer</button>
      </div>
    `;
  }

  function escHtml(s){
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  // Construit l'URL de recherche Google Maps d'un restaurant à partir de son nom et de ses
  // coordonnées (on ne dispose pas d'identifiant de fiche Google via OpenStreetMap/Overpass).
  // Utilisée à la fois par le popup de la carte et par la fenêtre de confirmation.
  function urlGoogleMaps(nom, lat, lon){
    if(!nom || lat == null || lon == null) return null;
    return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(nom + " " + lat + "," + lon)}`;
  }

  function redessinerMarqueur(r){
    let m = markers[r.id];
    if(!m){
      m = L.marker([r.lat, r.lon], {icon: iconResto(r.id===selectedId, r.id===deplacableId), draggable:false}).addTo(map);
      markers[r.id] = m;
      m.on("popupopen", ()=>{
        debugLog(`événement Leaflet "popupopen" reçu pour "${r.name || r.id}"`);
        brancherEditionPopup(r.id);
      });
      m.on("popupclose", ()=> debugLog(`événement Leaflet "popupclose" reçu pour "${r.name || r.id}"`));
      m.on("click", ()=>{
        debugLog(`clic direct sur l'icône "${r.name || r.id}" (marker.click Leaflet)`);
        definirSelection(r.id);
      });
      m.on("dragend", ()=> gererDeplacement(r.id));
      m.on("drag", ()=> relancerMinuteurDeplacement(r.id));
      if(r.id === deplacableId && m.dragging) m.dragging.enable();
    }else{
      m.setLatLng([r.lat, r.lon]);
      m.setIcon(iconResto(r.id===selectedId, r.id===deplacableId));
    }
    // autoPan:false — notre code recentre déjà explicitement la carte sur le marqueur juste après
    // l'ouverture du popup (voir definirSelection/map.setView), ce qui entrait en conflit avec le
    // repositionnement automatique interne de Leaflet (autoPan, activé par défaut) : les deux
    // ajustements de vue simultanés faisaient refermer le popup aussitôt ouvert (constaté dans le
    // journal de debug : popupclose ~2ms après popupopen, quelle que soit la taille de la carte).
    m.bindPopup(popupHTML(r), {autoPan:false});
    // bindPopup() ajoute automatiquement (une seule fois, en interne) un gestionnaire de clic
    // Leaflet qui BASCULE le popup (ouvre/ferme). Notre propre gestionnaire "click" ci-dessus
    // (m.on("click", ...)) ouvre déjà le popup via definirSelection(). Les deux s'exécutant sur
    // le même clic, l'un juste après l'autre (le nôtre étant ajouté en premier, donc exécuté en
    // premier), le gestionnaire interne de Leaflet voyait ensuite le popup déjà ouvert et le
    // refermait aussitôt : constaté dans le journal de debug (openPopup() réussi puis
    // "popupclose" ~1 ms plus tard — le popup clignote et se referme). On retire ce gestionnaire
    // interne pour ne garder qu'un seul point de contrôle de l'ouverture du popup. Le clic direct
    // sur une icône ne fonctionnait donc jamais de façon fiable, contrairement au clic à
    // proximité qui passe par le clic sur la carte elle-même et ne déclenche pas ce handler.
    m.off("click", m._openPopup, m);
  }

  // Sélectionne un restaurant : met en surbrillance dans la liste et sur la carte,
  // centre toujours la carte sur son icône et ouvre le popup. N'a aucun effet sur la
  // possibilité de déplacer l'icône (voir activerDeplacement / le bouton "Déplacer" de la liste).
  function definirSelection(id){
    try{
      recalerTailleCarte("avant sélection/popup");
      const precedent = selectedId;
      selectedId = id;
      if(precedent && precedent !== id && markers[precedent]){
        markers[precedent].setIcon(iconResto(false, precedent===deplacableId));
      }
      if(id && markers[id]){
        markers[id].setIcon(iconResto(true, id===deplacableId));
        // L'ouverture du popup se fait AVANT le setView : Leaflet déclenche son propre
        // "auto-pan" pour rendre le popup visible, ce qui peut décentrer le marqueur.
        // Le setView explicite ci-dessous, exécuté après, a donc toujours le dernier mot
        // et garantit que le marqueur reste bien au centre de la carte.
        markers[id].openPopup();
        const tailleCarte = map.getSize();
        const rectCarte = map.getContainer().getBoundingClientRect();
        debugLog(`definirSelection("${id}") : openPopup() appelé — isPopupOpen()=${markers[id].isPopupOpen()}, taille carte connue de Leaflet=${tailleCarte.x}x${tailleCarte.y}, taille réelle du conteneur=${rectCarte.width.toFixed(0)}x${rectCarte.height.toFixed(0)}`);
        // Vérification différée (le temps que Leaflet insère/anime le DOM du popup) : la
        // dimension réelle du popup permet de distinguer "jamais créé" de "créé mais invisible
        // (taille nulle, hors-écran, recouvert)".
        requestAnimationFrame(()=> requestAnimationFrame(()=>{
          const elPopup = document.querySelector(".leaflet-popup");
          if(elPopup){
            const rect = elPopup.getBoundingClientRect();
            const style = getComputedStyle(elPopup);
            debugLog(`.leaflet-popup trouvé dans le DOM — rect=(${rect.left.toFixed(0)},${rect.top.toFixed(0)}) ${rect.width.toFixed(0)}x${rect.height.toFixed(0)}, display=${style.display}, visibility=${style.visibility}, opacity=${style.opacity}, z-index=${style.zIndex}`);
          }else{
            debugLog(".leaflet-popup absent du DOM après openPopup() — le popup n'a pas été créé.");
          }
        }));
        map.setView(markers[id].getLatLng(), Math.max(map.getZoom(), 16), {animate:true});
      }
      rafraichirListe();
    }catch(e){
      debugLog("definirSelection: EXCEPTION — " + e.message);
      throw e;
    }
  }

  // Active le mode déplacement pour un restaurant : rend son icône déplaçable (glisser-déposer)
  // et la colore en vert, ainsi que le bouton "Déplacer" correspondant dans la liste.
  // Un seul restaurant à la fois peut être en mode déplacement : en activer un désactive
  // automatiquement le précédent. Le délai de 10 s se réinitialise en continu tant que
  // l'icône est en train d'être glissée (et à chaque relâchement) : il faut 10 secondes
  // SANS AUCUN mouvement de l'icône pour que le mode déplacement se désactive automatiquement
  // (icône et bouton reprennent alors leur couleur normale).
  function activerDeplacement(id){
    if(deplacableId === id){
      // Reclique sur le bouton déjà actif : désactive le mode déplacement.
      desactiverDeplacement();
      return;
    }
    desactiverDeplacement();
    deplacableId = id;
    deplacementEffectue = false;
    const m = markers[id];
    if(m){
      if(m.dragging) m.dragging.enable();
      m.setIcon(iconResto(id===selectedId, true));
      map.setView(m.getLatLng(), Math.max(map.getZoom(), 16), {animate:true});
    }
    relancerMinuteurDeplacement(id);
    statut("Faites glisser l'icône sur la carte dans les 10 secondes pour la déplacer.", "ok");
    rafraichirListe();
  }

  // Relance le délai de 10 s avant que le mode déplacement ne s'éteigne. Appelée en continu
  // pendant le glisser (événement "drag" de Leaflet, déclenché à chaque mouvement tant que
  // l'icône est tenue) ainsi qu'à chaque relâchement : il faut donc 10 secondes SANS aucun
  // mouvement de l'icône pour que le mode déplacement se désactive automatiquement.
  function relancerMinuteurDeplacement(id){
    if(id !== deplacableId) return;
    if(deplacableTimer) clearTimeout(deplacableTimer);
    deplacableTimer = setTimeout(()=> desactiverDeplacement(), 10000);
  }

  // Désactive le mode déplacement, que ce soit automatiquement (10 s sans mouvement),
  // manuellement (reclic sur "Déplacer", ou activation d'un autre restaurant) ou lors d'une
  // suppression. C'est SEULEMENT à ce moment-là — la fin réelle de la séquence de déplacement —
  // que la recherche du restaurant le plus proche est lancée, et uniquement si l'icône a
  // effectivement été déplacée entre-temps. Passer {rechercher:false} pour l'ignorer (cas de
  // la suppression du restaurant).
  function desactiverDeplacement({rechercher=true} = {}){
    if(deplacableTimer){ clearTimeout(deplacableTimer); deplacableTimer = null; }
    if(deplacableId){
      const id = deplacableId;
      const aBouge = deplacementEffectue;
      const m = markers[id];
      if(m){
        if(m.dragging) m.dragging.disable();
        m.setIcon(iconResto(id===selectedId, false));
      }
      deplacableId = null;
      deplacementEffectue = false;
      rafraichirListe();
      if(rechercher && aBouge){
        const r = restaurants.find(x=>x.id===id);
        if(r) identifierEtConfirmer(r);
      }
    }
  }

  // Appelé à chaque relâchement de l'icône : met à jour les coordonnées immédiatement.
  // La recherche du restaurant le plus proche n'est PAS lancée ici : elle n'a lieu qu'à la
  // fin réelle du mode déplacement (voir desactiverDeplacement), pour éviter qu'elle ne se
  // déclenche prématurément pendant qu'on ajuste encore la position en plusieurs fois.
  function gererDeplacement(id){
    const r = restaurants.find(x=>x.id===id);
    const m = markers[id];
    if(!r || !m) return;
    const ll = m.getLatLng();
    r.lat = ll.lat;
    r.lon = ll.lng;
    r.maj = new Date().toISOString();
    sauverLocal();
    rafraichirListe();
    pousserVersGithubDifféré();

    if(id === deplacableId) deplacementEffectue = true;
    relancerMinuteurDeplacement(id);
  }

  function supprimerMarqueur(id){
    const m = markers[id];
    if(m){ map.removeLayer(m); delete markers[id]; }
  }

  function brancherEditionPopup(id){
    const popupEl = document.querySelector(`.popup-text[data-id="${id}"]`)?.closest(".leaflet-popup-content");
    if(!popupEl) return;
    popupEl.querySelectorAll(".popup-text").forEach(el=>{
      el.ondblclick = () => passerEnEdition(el);
    });
    const delBtn = popupEl.querySelector("[data-del]");
    if(delBtn){
      delBtn.onclick = () => supprimerRestaurant(delBtn.getAttribute("data-del"));
    }
  }

  function passerEnEdition(el){
    const id = el.getAttribute("data-id");
    const field = el.getAttribute("data-field");
    const r = restaurants.find(x=>x.id===id);
    if(!r) return;
    const depuisPopup = !!el.closest(".leaflet-popup-content");
    const valeurActuelle = r[field] || "";
    const input = document.createElement("input");
    input.type = "text";
    input.className = "popup-edit";
    input.value = valeurActuelle;
    el.replaceWith(input);
    input.focus();
    input.select();

    const valider = () => {
      const nv = input.value.trim();
      r[field] = nv;
      r.maj = new Date().toISOString();
      sauverLocal();
      const newEl = document.createElement("div");
      newEl.className = el.className;
      newEl.setAttribute("data-id", id);
      newEl.setAttribute("data-field", field);
      newEl.textContent = nv || (field === "name" ? "Nouveau restaurant" : "(adresse non définie, double-cliquez pour saisir)");
      newEl.ondblclick = () => passerEnEdition(newEl);
      input.replaceWith(newEl);
      redessinerMarqueur(r);
      if(depuisPopup){
        const m = markers[id];
        if(m) m.openPopup();
        brancherEditionPopup(id);
      }
      rafraichirListe();
      pousserVersGithubDifféré();
    };
    input.addEventListener("blur", valider);
    input.addEventListener("keydown", (ev)=>{
      if(ev.key === "Enter"){ input.blur(); }
      if(ev.key === "Escape"){ input.value = valeurActuelle; input.blur(); }
    });
  }

  function supprimerRestaurant(id){
    if(!confirm("Supprimer ce restaurant de la liste ?")) return;
    if(id === deplacableId) desactiverDeplacement({rechercher:false});
    if(id === selectedId) selectedId = null;
    restaurants = restaurants.filter(r=>r.id!==id);
    suppressions = suppressions.filter(s=>s.id!==id);
    suppressions.push({id, maj: new Date().toISOString()});
    sauverLocal();
    sauverSuppressionsLocal();
    supprimerMarqueur(id);
    rafraichirListe();
    // Envoi immédiat (pas de délai) : une suppression est une action ponctuelle et souvent la
    // dernière avant de quitter l'appli (cf. forcerEnvoiSiEnAttente ci-dessous pour les autres
    // modifications encore en attente à ce moment-là) — mieux vaut ne pas dépendre du minuteur
    // de 1.2 s qui pourrait ne jamais se déclencher si l'onglet est aussitôt mis en arrière-plan.
    if(pushTimer){ clearTimeout(pushTimer); pushTimer = null; }
    pousserVersGithub(false);
  }

  // ---------- Liste latérale ----------
  function rafraichirListe(){
    const body = document.getElementById("listBody");
    const restosListe = restaurants.filter(r => (r.liste||"") === listeActuelle);
    document.getElementById("countLbl").textContent = restosListe.length;
    document.getElementById("listeNomLbl").textContent = listeActuelle ? listeActuelle : "(sans nom)";
    if(restosListe.length === 0){
      body.innerHTML = '<div class="empty-hint">Aucun restaurant dans cette liste. Utilisez le bouton « Nouveau restaurant ».</div>';
      return;
    }
    const tries = [...restosListe].sort((a,b)=> (b.maj||"").localeCompare(a.maj||""));
    body.innerHTML = tries.map(r => {
      const enEdition = editingIds.has(r.id);
      const txtHtml = enEdition
        ? `<textarea class="list-edit-input nom-input" data-field="name" rows="1" placeholder="Nom du restaurant">${escHtml(r.name || "")}</textarea>
           <textarea class="list-edit-input adr-input" data-field="address" rows="1" placeholder="Adresse">${escHtml(r.address || "")}</textarea>`
        : `<div class="popup-text nom" data-id="${r.id}" data-field="name">${escHtml(r.name || "Nouveau restaurant")}</div>
           <div class="popup-text adr" data-id="${r.id}" data-field="address">${escHtml(r.address || "adresse non définie")}</div>`;
      return `
      <div class="resto-item${r.id===selectedId ? ' selected' : ''}" data-goto="${r.id}">
        <div class="txt">
          ${txtHtml}
          <div class="item-liste-row">
            <span class="item-liste-label">Liste</span>
            <select class="item-liste-select" data-liste-id="${r.id}">${optionsListesHtml(r.liste)}</select>
          </div>
        </div>
        <div class="actions">
          <button class="btn-edit${enEdition ? ' active' : ''}" data-edit="${r.id}">Edit</button>
          <button class="btn-move${r.id===deplacableId ? ' active' : ''}" data-move="${r.id}">Déplacer</button>
          <button class="btn-danger" data-del="${r.id}">✕</button>
        </div>
      </div>
    `;
    }).join("");
    body.querySelectorAll("[data-goto]").forEach(el=>{
      el.addEventListener("click",(ev)=>{
        if(ev.target.closest("[data-del]") || ev.target.closest("[data-move]") || ev.target.closest("[data-edit]") || ev.target.closest(".item-liste-select") || ev.target.tagName === "INPUT") return;
        definirSelection(el.getAttribute("data-goto"));
      });
    });
    body.querySelectorAll(".item-liste-select").forEach(el=>{
      el.addEventListener("click",(ev)=> ev.stopPropagation());
      el.addEventListener("change",(ev)=>{
        ev.stopPropagation();
        changerListeItem(el.getAttribute("data-liste-id"), el.value);
      });
    });
    body.querySelectorAll("[data-move]").forEach(el=>{
      el.addEventListener("click",(ev)=>{
        ev.stopPropagation();
        activerDeplacement(el.getAttribute("data-move"));
      });
    });
    body.querySelectorAll("[data-del]").forEach(el=>{
      el.addEventListener("click",(ev)=>{
        ev.stopPropagation();
        supprimerRestaurant(el.getAttribute("data-del"));
      });
    });
    body.querySelectorAll("[data-edit]").forEach(el=>{
      el.addEventListener("click",(ev)=>{
        ev.stopPropagation();
        basculerEditionListe(el.getAttribute("data-edit"));
      });
    });
    body.querySelectorAll(".list-edit-input").forEach(el=>{
      el.addEventListener("click",(ev)=> ev.stopPropagation());
      el.addEventListener("keydown",(ev)=>{
        const itemEl = el.closest("[data-goto]");
        const id = itemEl && itemEl.getAttribute("data-goto");
        if(ev.key === "Enter"){ ev.preventDefault(); basculerEditionListe(id); }
        if(ev.key === "Escape"){ ev.preventDefault(); editingIds.delete(id); rafraichirListe(); }
      });
      // Double-clic/double-tap dans le champ (uniquement possible ici, en mode édition) :
      // agrandit la zone (passage en textarea multi-lignes qui grandit avec le texte)
      // pour éditer confortablement ; un nouveau double-clic/double-tap lui redonne sa taille d'origine.
      surDoubleTap(el, ()=>{
        el.classList.toggle("expanded");
        if(el.classList.contains("expanded")){
          ajusterHauteurAuto(el);
        }else{
          el.style.height = "";
        }
        el.focus();
      });
      // Tant que la zone est agrandie, elle grandit automatiquement avec le texte saisi.
      el.addEventListener("input", ()=>{
        if(el.classList.contains("expanded")) ajusterHauteurAuto(el);
      });
    });
    body.querySelectorAll(".popup-text").forEach(el=>{
      el.ondblclick = (ev)=>{
        ev.stopPropagation();
        passerEnEdition(el);
      };
    });
  }

  // Ouvre/ferme le mode édition (nom + adresse) d'un item de la liste.
  // En fermant, sauvegarde les valeurs saisies dans les champs.
  function basculerEditionListe(id){
    if(editingIds.has(id)){
      const itemEl = document.querySelector(`.resto-item[data-goto="${id}"]`);
      const r = restaurants.find(x=>x.id===id);
      if(itemEl && r){
        const nomInput = itemEl.querySelector('[data-field="name"]');
        const adrInput = itemEl.querySelector('[data-field="address"]');
        if(nomInput) r.name = nomInput.value.trim();
        if(adrInput) r.address = adrInput.value.trim();
        r.maj = new Date().toISOString();
        sauverLocal();
        redessinerMarqueur(r);
        pousserVersGithubDifféré();
      }
      editingIds.delete(id);
    }else{
      editingIds.add(id);
    }
    rafraichirListe();
    if(editingIds.has(id)){
      const itemEl = document.querySelector(`.resto-item[data-goto="${id}"]`);
      const nomInput = itemEl && itemEl.querySelector('[data-field="name"]');
      if(nomInput){ nomInput.focus(); nomInput.select(); }
    }
  }

  // ---------- Reverse geocoding (Nominatim) ----------
  async function reverseGeocode(lat, lon, signal){
    const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1&namedetails=1&accept-language=fr`;
    const res = await fetchAvecDelai(url, { headers: { "Accept": "application/json" } }, 8000, signal);
    if(!res.ok) throw new Error("Nominatim HTTP " + res.status);
    const data = await res.json();

    let nom = "";
    if(data.namedetails && data.namedetails.name){
      nom = data.namedetails.name;
    }else if(data.name){
      nom = data.name;
    }else if(data.address && (data.address.restaurant || data.address.amenity)){
      nom = data.address.restaurant || data.address.amenity;
    }

    let adresse = "";
    if(data.address){
      const a = data.address;
      const numRue = [a.house_number, a.road].filter(Boolean).join(" ");
      const ville = a.postcode || a.city || a.town || a.village
        ? [a.postcode, a.city || a.town || a.village].filter(Boolean).join(" ")
        : "";
      adresse = [numRue, ville].filter(Boolean).join(", ");
    }
    if(!adresse && data.display_name){
      adresse = data.display_name;
    }

    return {nom, adresse};
  }

  // ---------- Recherche du restaurant le plus proche (Overpass / OSM) ----------
  function distanceMetres(lat1, lon1, lat2, lon2){
    const R = 6371000;
    const toRad = d => d * Math.PI / 180;
    const dLat = toRad(lat2 - lat1);
    const dLon = toRad(lon2 - lon1);
    const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  // fetch avec un délai maximal propre (au lieu de dépendre du délai par défaut,
  // parfois très long, du système/navigateur), tout en restant annulable via signalExterne.
  async function fetchAvecDelai(url, options, delaiMs, signalExterne){
    const controllerLocal = new AbortController();
    const timeoutId = setTimeout(()=> controllerLocal.abort(), delaiMs);
    const onExterneAbort = () => controllerLocal.abort();
    if(signalExterne){
      if(signalExterne.aborted) controllerLocal.abort();
      else signalExterne.addEventListener("abort", onExterneAbort, {once:true});
    }
    try{
      return await fetch(url, Object.assign({}, options, {signal: controllerLocal.signal}));
    }finally{
      clearTimeout(timeoutId);
      if(signalExterne) signalExterne.removeEventListener("abort", onExterneAbort);
    }
  }

  // Plusieurs miroirs publics de l'API Overpass : le serveur overpass-api.de est en fait
  // une fédération de machines, dont certaines ne renvoient pas toujours d'en-tête CORS
  // (Access-Control-Allow-Origin). On tente donc plusieurs miroirs en parallèle.
  // Note : overpass.private.coffee est le nom actuel du service précédemment connu sous
  // overpass.kumi.systems (renommage officiel d'après le wiki OpenStreetMap) — l'ancien
  // nom peut être beaucoup plus lent selon la route réseau empruntée.
  const OVERPASS_ENDPOINTS = [
    "https://overpass-api.de/api/interpreter",
    "https://overpass.private.coffee/api/interpreter",
    "https://overpass.openstreetmap.ru/api/interpreter"
  ];

  function extraireRestaurants(data, lat, lon, limite){
    const candidats = (data.elements || []).map(el=>{
      const la = el.lat !== undefined ? el.lat : (el.center ? el.center.lat : null);
      const lo = el.lon !== undefined ? el.lon : (el.center ? el.center.lon : null);
      const nom = el.tags && el.tags.name;
      if(la == null || lo == null || !nom) return null;
      const t = el.tags;
      const numRue = [t["addr:housenumber"], t["addr:street"]].filter(Boolean).join(" ");
      const ville = [t["addr:postcode"], t["addr:city"]].filter(Boolean).join(" ");
      return {
        nom,
        adresse: [numRue, ville].filter(Boolean).join(", "),
        distance: Math.round(distanceMetres(lat, lon, la, lo)),
        lat: la,
        lon: lo
      };
    }).filter(Boolean).sort((a,b)=> a.distance - b.distance);
    return candidats.slice(0, limite);
  }

  async function interrogerMiroir(endpoint, requete, signal){
    const res = await fetchAvecDelai(endpoint, {
      method: "POST",
      body: "data=" + encodeURIComponent(requete)
    }, 8000, signal);
    if(!res.ok) throw new Error("HTTP " + res.status + " (" + endpoint + ")");
    return res.json();
  }

  async function rechercherRestaurantsProches(lat, lon, limite, signal){
    const rayon = 200; // mètres
    const requete = `[out:json][timeout:15];(node["amenity"="restaurant"]["name"](around:${rayon},${lat},${lon});way["amenity"="restaurant"]["name"](around:${rayon},${lat},${lon});relation["amenity"="restaurant"]["name"](around:${rayon},${lat},${lon}););out center tags;`;
    if(signal && signal.aborted) throw new DOMException("Recherche annulée", "AbortError");
    try{
      // Les miroirs sont interrogés EN PARALLÈLE (pas l'un après l'autre) : on garde le
      // premier qui répond correctement, avec un délai maximal de 8 s chacun — au lieu
      // d'attendre le délai par défaut (parfois ~20 s) de chaque miroir en séquence.
      const data = await Promise.any(
        OVERPASS_ENDPOINTS.map(endpoint => interrogerMiroir(endpoint, requete, signal))
      );
      return extraireRestaurants(data, lat, lon, limite);
    }catch(err){
      if(signal && signal.aborted) throw new DOMException("Recherche annulée", "AbortError");
      if(err && err.name === "AggregateError" && err.errors && err.errors.length){
        throw err.errors[0];
      }
      throw err;
    }
  }

  // ---------- Boîte de dialogue de confirmation ----------
  function ouvrirModalIdentification({nom, adresse, indice, alternatives, lat, lon}){
    return new Promise((resolve)=>{
      const overlay = document.getElementById("modalOverlay");
      const inputNom = document.getElementById("modalNom");
      const inputAdr = document.getElementById("modalAdresse");
      const hint = document.getElementById("modalHint");
      const lienMaps = document.getElementById("modalMapsLink");
      const champAlt = document.getElementById("modalAlternativesChamp");
      const selectAlt = document.getElementById("modalAlternatives");
      const btnValider = document.getElementById("modalValider");
      const btnAnnuler = document.getElementById("modalAnnuler");

      const listeAlt = alternatives || [];
      inputNom.value = nom || "";
      inputAdr.value = adresse || "";
      hint.textContent = indice || "";
      selectAlt.innerHTML = '<option value="">— choisir une autre suggestion —</option>' +
        listeAlt.map((a,i)=> `<option value="${i}">${escHtml(a.nom)} (${a.distance} m)</option>`).join("");
      champAlt.style.display = listeAlt.length ? "flex" : "none";
      selectAlt.value = "";

      // Lien vers la fiche Google Maps du restaurant identifié : construit à partir de son nom
      // et de ses coordonnées (recherche Google Maps, faute de disposer d'un identifiant de
      // fiche Google). Masqué si on n'a ni coordonnées ni nom exploitables (aucun restaurant trouvé).
      const majLienMaps = (n, la, lo) => {
        const url = urlGoogleMaps(n, la, lo);
        if(url){
          lienMaps.href = url;
          lienMaps.style.display = "inline-block";
        }else{
          lienMaps.style.display = "none";
        }
      };
      majLienMaps(nom, lat, lon);

      overlay.classList.add("open");
      setTimeout(()=> inputNom.focus(), 60);

      const onChangeAlt = () => {
        const idx = selectAlt.value;
        // Choisir une suggestion alternative ne remplace que le nom, jamais l'adresse.
        if(idx !== "" && listeAlt[idx]){
          inputNom.value = listeAlt[idx].nom;
          majLienMaps(listeAlt[idx].nom, listeAlt[idx].lat, listeAlt[idx].lon);
        }else{
          majLienMaps(nom, lat, lon);
        }
      };
      const nettoyer = () => {
        overlay.classList.remove("open");
        btnValider.removeEventListener("click", onValider);
        btnAnnuler.removeEventListener("click", onAnnuler);
        overlay.removeEventListener("keydown", onKey);
        selectAlt.removeEventListener("change", onChangeAlt);
      };
      const onValider = () => {
        const nv = inputNom.value.trim();
        const av = inputAdr.value.trim();
        nettoyer();
        resolve({ok:true, nom:nv, adresse:av});
      };
      const onAnnuler = () => { nettoyer(); resolve({ok:false}); };
      const onKey = (ev) => {
        if(ev.key === "Enter" && ev.target !== selectAlt) onValider();
        if(ev.key === "Escape") onAnnuler();
      };
      selectAlt.addEventListener("change", onChangeAlt);
      btnValider.addEventListener("click", onValider);
      btnAnnuler.addEventListener("click", onAnnuler);
      overlay.addEventListener("keydown", onKey);
    });
  }

  // ---------- Fenêtre d'attente annulable ----------
  function ouvrirAttente(message){
    const overlay = document.getElementById("attenteOverlay");
    const texte = document.getElementById("attenteTexte");
    const chrono = document.getElementById("attenteChrono");
    const btnAnnuler = document.getElementById("attenteAnnuler");
    texte.textContent = message || "Recherche en cours…";
    chrono.textContent = "0 s";
    overlay.classList.add("open");
    const controller = new AbortController();
    attenteControleur = controller;
    btnAnnuler.onclick = () => controller.abort();

    const debut = Date.now();
    attenteIntervalId = setInterval(()=>{
      chrono.textContent = Math.round((Date.now() - debut) / 1000) + " s";
    }, 1000);

    return controller;
  }

  function fermerAttente(){
    document.getElementById("attenteOverlay").classList.remove("open");
    document.getElementById("attenteAnnuler").onclick = null;
    attenteControleur = null;
    if(attenteIntervalId){ clearInterval(attenteIntervalId); attenteIntervalId = null; }
  }

  // Cherche les restaurants les plus proches (nommés, via Overpass) + l'adresse (via Nominatim),
  // puis demande confirmation dans une boîte de dialogue. Annulable via la fenêtre d'attente.
  async function identifierEtConfirmer(r, options){
    const precision = options && options.precision;
    const controller = ouvrirAttente("Recherche du restaurant à proximité…");

    const [resProches, resAdresse] = await Promise.allSettled([
      rechercherRestaurantsProches(r.lat, r.lon, 5, controller.signal),
      reverseGeocode(r.lat, r.lon, controller.signal)
    ]);

    const annule = controller.signal.aborted;
    fermerAttente();
    if(annule){
      statut("Recherche annulée. Vous pouvez saisir le nom et l'adresse manuellement (double-clic).", "");
      return;
    }

    let principal = null;
    let alternatives = [];
    let indice;

    if(resProches.status === "fulfilled"){
      const proches = resProches.value || [];
      principal = proches[0] || null;
      alternatives = proches.slice(1, 5);
      indice = principal
        ? `Restaurant le plus proche : ${principal.nom} (${principal.distance} m).`
        : "Aucun restaurant nommé trouvé dans OpenStreetMap à moins de 200 m de ce point.";
    }else{
      const msg = (resProches.reason && resProches.reason.message) ? resProches.reason.message : "erreur inconnue";
      indice = `La recherche de restaurants à proximité a échoué sur tous les serveurs Overpass essayés : ${msg}.`;
      console.error("Overpass:", resProches.reason);
    }
    if(precision != null){
      indice += ` Position localisée à ${Math.round(precision)} m près.`;
    }

    const adresseNominatim = (resAdresse.status === "fulfilled" && resAdresse.value) ? resAdresse.value.adresse : "";
    const adresseTrouvee = adresseNominatim || (principal ? principal.adresse : "") || r.address;

    const choix = await ouvrirModalIdentification({
      nom: principal ? principal.nom : r.name,
      adresse: adresseTrouvee,
      indice,
      alternatives,
      lat: principal ? principal.lat : r.lat,
      lon: principal ? principal.lon : r.lon
    });

    if(choix.ok){
      r.name = choix.nom || "Nouveau restaurant";
      r.address = choix.adresse || "";
      r.maj = new Date().toISOString();
      sauverLocal();
      redessinerMarqueur(r);
      if(markers[r.id] && markers[r.id].isPopupOpen()){
        markers[r.id].openPopup();
        brancherEditionPopup(r.id);
      }
      rafraichirListe();
      pousserVersGithubDifféré();
      statut("Informations confirmées.", "ok");
    }else{
      statut("Suggestion ignorée. Vous pouvez saisir les informations manuellement (double-clic).", "");
    }
  }


  // Sur iPhone (notamment Chrome iOS, qui utilise le même moteur WebKit que Safari et peut
  // conserver une version en cache), on force un rechargement complet de la page depuis le
  // serveur à CHAQUE appui sur "Modifier", pour être certain de ne jamais travailler sur une
  // ancienne version restée en cache. L'état visé (activé/désactivé) est mémorisé le temps du
  // rechargement puis réappliqué automatiquement au retour (voir plus bas).
  function estIOS(){
    return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  }

  // Bouton "Modifier" : affiche/masque les boutons "GitHub", "Test" et les boutons d'action
  // (Edit, Déplacer, ✕) de chaque item de la liste, tous masqués par défaut. Un nouveau clic
  // les remasque et redonne au bouton sa couleur par défaut.
  document.getElementById("btnModifier").addEventListener("click", ()=>{
    const prochainEtat = !document.body.classList.contains("mode-modif");
    if(estIOS()){
      try{ sessionStorage.setItem(SS_MODIF_KEY, prochainEtat ? "1" : "0"); }catch(e){}
      const url = new URL(location.href);
      url.searchParams.set("_r", Date.now()); // paramètre anti-cache : force une requête réseau, pas le cache
      location.href = url.toString();
      return;
    }
    document.body.classList.toggle("mode-modif", prochainEtat);
    document.getElementById("btnModifier").classList.toggle("active", prochainEtat);
  });

  // Au chargement de la page (après un rechargement forcé déclenché ci-dessus sur iPhone),
  // réapplique l'état "Modifier" voulu par l'utilisateur avant le rechargement.
  (function reappliquerEtatModifApresRechargement(){
    try{
      const v = sessionStorage.getItem(SS_MODIF_KEY);
      if(v === null) return;
      sessionStorage.removeItem(SS_MODIF_KEY);
      if(v === "1"){
        document.body.classList.add("mode-modif");
        document.getElementById("btnModifier").classList.add("active");
      }
    }catch(e){}
  })();

  function cfgComplete(){
